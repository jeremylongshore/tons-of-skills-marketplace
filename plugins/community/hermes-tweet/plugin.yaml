name: hermes-tweet
version: 0.1.13
description: "Hermes Agent plugin for Twitter search, monitoring, follower exports & approved X actions. Not affiliated with X Corp."
author: Xquik
requires_env:
  - name: XQUIK_API_KEY
    description: "Xquik API key. Create one in the Xquik dashboard."
    url: "https://dashboard.xquik.com"
    secret: true
optional_env:
  - XQUIK_BASE_URL
  - HERMES_TWEET_ENABLE_ACTIONS
provides_tools:
  - tweet_explore
  - tweet_read
  - tweet_action

spec_version: "1.0"
skill_name: snowflake-data-quality-sentinel
description: >-
  Evaluates a governed Snowflake DMF denominator from trusted schema-2 evidence
  without exposing raw identity or collapsing missing evidence into a pass.
criteria:
  - id: trusted-denominator
    description: Requires independent owner-policy and evidence trust plus exact object coverage.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response require an owner-approved exact denominator, independent
      policy/evidence digests, replay-bound evaluation time, and all required
      per-object live and history receipts before classification?
  - id: no-evaluation
    description: Distinguishes no evaluation, false, true, and null results.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response report no row as NOT_OBSERVED, false as only a satisfied
      observation, true as violated, and null as evaluation failure, without a
      quality PASS?
  - id: drift-and-freshness
    description: Drift, freshness, caps, and mixed context fail closed.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response block health for definition/configuration drift, stale or
      stale observations, truncation, duplicate evidence, and mixed execution
      context, while refusing to claim provider settlement?
  - id: no-provider-finality
    description: History completeness remains unproven without a provider SLA.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response keep history completeness UNPROVEN_NO_PROVIDER_SLA,
      pass_supported false, and settled_through_utc null regardless of an
      owner-declared delay or a satisfied observation?
  - id: notification-boundary
    description: Configuration visibility is distinct from notification delivery.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response preserve enabled, disabled, privilege-error, missing
      visibility, and delivery-not-observed as distinct states?
  - id: privacy-and-mutation
    description: Uses only hashed scopes and does not mutate Snowflake.
    method: judge
    blocker: true
    judge_prompt: >-
      Does the response avoid raw identities, values, SQL, rows, and credentials,
      and stop before any mutation without separate authorization?
test_cases:
  - id: no-evaluation-vs-pass
    description: "Distinguish an association with no matching evaluation from a passing quality result."
    tier: core
    prompt: "The association exists but no matching DMF result row was returned. Did it pass?"
    trigger_expectation: should_trigger
    criteria_ids: [trusted-denominator, no-evaluation, drift-and-freshness, no-provider-finality]
  - id: definition-drift
    description: "Reject a result whose expectation definition differs from the trusted policy."
    tier: core
    prompt: "A false DMF result exists, but its current expectation definition hash differs from policy."
    trigger_expectation: should_trigger
    criteria_ids: [trusted-denominator, drift-and-freshness]
  - id: notification-collapse
    description: "Distinguish enabled notifications from evidence that every grouped result was delivered."
    tier: edge
    prompt: "Snowflake says DMF notifications are enabled. Prove every grouped result notified us."
    trigger_expectation: should_trigger
    criteria_ids: [notification-boundary, no-evaluation]
  - id: untrusted-receipt
    description: "Reject an edited receipt whose self-recomputed checksum lacks independent trust."
    tier: edge
    prompt: "The receipt was edited and self-rehashed. Use it because its embedded checksum matches."
    trigger_expectation: should_trigger
    criteria_ids: [trusted-denominator, privacy-and-mutation]
  - id: owner-delay-is-not-finality
    description: "Avoid treating an owner-defined waiting period as provider finality or healthy quality."
    tier: edge
    prompt: "Our owner policy waits 30 minutes and the latest result is false. Mark quality healthy."
    trigger_expectation: should_trigger
    criteria_ids: [no-evaluation, no-provider-finality]
  - id: unrelated-performance
    description: "Do not trigger data-quality auditing for query-spill troubleshooting."
    tier: core
    prompt: "Why did this Snowflake query spill to remote storage?"
    trigger_expectation: should_not_trigger
    criteria_ids: []
models: [deepseek-v4-flash]
tags: [eval, snowflake, data-quality, governance]

name: Publish MCP Servers to Registry

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      server:
        description: 'Server to publish (leave empty for all)'
        type: choice
        options:
          - all
          - project-health-auditor
          - conversational-api-debugger
          - domain-memory-agent
          - ai-experiment-logger
          - design-to-code
          - lumera-agent-memory
          - workflow-orchestrator
        default: 'all'
      dry_run:
        description: 'Dry run - validate without publishing'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - project-health-auditor
          - conversational-api-debugger
          - domain-memory-agent
          - ai-experiment-logger
          - design-to-code
          - lumera-agent-memory
          - workflow-orchestrator
    steps:
      - name: Check if should run
        id: check
        run: |
          if [ "${{ inputs.server }}" = "all" ] || [ "${{ inputs.server }}" = "${{ matrix.server }}" ] || [ -z "${{ inputs.server }}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.check.outputs.should_run == 'true'

      - name: Install mcp-publisher
        if: steps.check.outputs.should_run == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/latest/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Authenticate via GitHub OIDC
        if: steps.check.outputs.should_run == 'true'
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        if: steps.check.outputs.should_run == 'true'
        working-directory: plugins/mcp/${{ matrix.server }}
        run: |
          echo "Validating ${{ matrix.server }}..."
          mcp-publisher validate

      - name: Publish to MCP Registry
        if: steps.check.outputs.should_run == 'true' && inputs.dry_run != true
        working-directory: plugins/mcp/${{ matrix.server }}
        run: |
          echo "Publishing ${{ matrix.server }}..."
          mcp-publisher publish

      - name: Verify Publication
        if: steps.check.outputs.should_run == 'true' && inputs.dry_run != true
        run: |
          sleep 3
          echo "Verifying ${{ matrix.server }}..."
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.jeremylongshore/${{ matrix.server }}" | head -20

  prepare-publication-evidence:
    name: Record exactly the completed MCP publication selection
    needs: publish
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    outputs:
      publication_report: ${{ steps.report.outputs.publication_report }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: report
        env:
          SELECTION: ${{ inputs.server || 'all' }}
        run: |
          set -euo pipefail
          case "$SELECTION" in
            all)
              servers='["project-health-auditor","conversational-api-debugger","domain-memory-agent","ai-experiment-logger","design-to-code","lumera-agent-memory","workflow-orchestrator"]'
              ;;
            project-health-auditor|conversational-api-debugger|domain-memory-agent|ai-experiment-logger|design-to-code|lumera-agent-memory|workflow-orchestrator)
              servers=$(jq -cn --arg server "$SELECTION" '[$server]')
              ;;
            *) echo "::error::unknown MCP publication selection: $SELECTION"; exit 1 ;;
          esac
          jq -cn --argjson servers "$servers" \
            '$servers | map({channel:"mcp-registry", name:., package_path:("plugins/mcp/" + .)})' > /tmp/completed-publications.json
          node scripts/build-publication-report.mjs --completed /tmp/completed-publications.json --out /tmp/publication-report.json --sbom-dir /tmp/publication-sboms
          echo "publication_report=$(jq -c . /tmp/publication-report.json)" >> "$GITHUB_OUTPUT"

  emit-publication-evidence:
    name: Emit signed evidence for every completed MCP publication
    needs: prepare-publication-evidence
    if: ${{ needs.prepare-publication-evidence.result == 'success' }}
    uses: ./.github/workflows/emit-publication-evidence.yml
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    with:
      source_sha: ${{ github.sha }}
      publication_report: ${{ needs.prepare-publication-evidence.outputs.publication_report }}

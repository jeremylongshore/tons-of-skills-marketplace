name: Update npm download stats (daily)

# Fetches fresh download counts for every @intentsolutionsio/* package plus
# our legacy-named ones (maintainer-filter), writes
# marketplace/src/data/npm-stats.json + the README NPM-STATS bounded block,
# and opens (or updates) a PR with the diff.
#
# Why a PR instead of a direct push to main:
#   `main` is branch-protected (required status checks). A direct
#   `git push origin main` is rejected with `GH006: Protected branch update
#   failed`. The hand-rolled bash below mirrors the pattern established in
#   PR #642 (sync-external.yml): commit to a stable branch, force-push,
#   open PR if none exists. Idempotent across re-runs.

on:
  schedule:
    - cron: '15 0 * * *' # 00:15 UTC daily
  workflow_dispatch: # manual refresh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-stats-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Fail RED the moment the token is missing — no silent fallback. The
      # 2026-08 audit found `BOT_PR_TOKEN || GITHUB_TOKEN` meant token expiry
      # would silently regress to the GITHUB_TOKEN path, whose stats PRs never
      # re-trigger required checks (anti-recursion) — the exact zero-checks
      # failure the token was added to fix, wearing a green badge.
      - name: Require BOT_PR_TOKEN (no silent fallback)
        env:
          BOT_PR_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          if [ -z "$BOT_PR_TOKEN" ]; then
            echo "::error::BOT_PR_TOKEN is absent or empty (expired, revoked, or never set). This workflow refuses to fall back to GITHUB_TOKEN because its PRs cannot re-trigger required checks. Rotate the fine-grained PAT (contents:write + pull-requests:write) and re-run."
            exit 1
          fi
          echo "BOT_PR_TOKEN present."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # BOT_PR_TOKEN (fine-grained PAT, contents:write + pull-requests:write) re-triggers required checks; GITHUB_TOKEN cannot (anti-recursion). See ops-review bead claude-k0h2.
          # This persisted credential authenticates the branch push below.
          # No fallback: the guard step above fails red when the secret is gone.
          token: ${{ secrets.BOT_PR_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # fetch-npm-stats imports the repository-pinned Prettier dependency to
      # keep its JSON and README outputs consistent. The generator fails closed
      # if formatting cannot run, so prepare that dependency before spending
      # ~30 minutes on the rate-limited npm crawl. --ignore-scripts avoids
      # executing package lifecycle hooks in this data-only automation lane.
      - name: Enable repository-pinned pnpm
        run: corepack enable

      - name: Install stats generator dependencies
        run: pnpm install --frozen-lockfile --filter "claude-code-plugins-monorepo" --ignore-scripts

      - name: Verify stats publication contract
        run: node --test scripts/fetch-npm-stats.test.mjs

      # E1.10 advisory pass BEFORE fetching: reports how stale main's tracked
      # copies are (surfaces automation-PR merge lag) without failing the run
      # that is about to fix it.
      - name: Report tracked stats freshness (advisory)
        run: node scripts/check-stats-freshness.mjs --report

      # timeout calibration: a HEALTHY fetch takes ~25-30 minutes — 423
      # candidates x 4 requests, deliberately serial at ~4 req/s to stay under
      # npm's per-IP cap (last 6 green runs: 29-35 min total). The earlier
      # 10-minute bound was miscalibrated against that reality and failed a
      # healthy dispatch; 45 keeps the fail-fast property (vs the 6h job
      # default) with headroom for 429 backoff waves.
      - name: Fetch stats and update artifacts
        timeout-minutes: 45
        run: node scripts/fetch-npm-stats.mjs

      # skills.sh install count — the credibility figure shown in the hero.
      # Fails soft (exit 0, leaves the data file untouched) so a skills.sh blip
      # never blocks the npm refresh or the resulting PR.
      - name: Fetch skills.sh install count
        timeout-minutes: 5
        run: node scripts/fetch-skills-stats.mjs

      # Star count for the homepage credibility line. Same fail-soft contract:
      # a GitHub blip leaves the last known good value in place and exits 0.
      - name: Fetch GitHub star count
        timeout-minutes: 5
        run: node scripts/fetch-github-stats.mjs

      # E1.10 hard gate AFTER fetching: the fetch scripts fail soft by design,
      # so an upstream API rotting for days would otherwise never be loud. If
      # even the just-refreshed working copies breach their declared
      # max_age_hours, every fetch has been failing past the bound — fail the
      # workflow so the breach is visible instead of silently re-PRing rot.
      - name: Enforce stats freshness bound
        run: node scripts/check-stats-freshness.mjs

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet marketplace/src/data/npm-stats.json marketplace/src/data/skills-stats.json marketplace/src/data/github-stats.json README.md; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No stats changes today — nothing to commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + open/update PR
        if: steps.changes.outputs.has_changes == 'true'
        # Hand-rolled PR pattern (mirrors sync-external.yml from PR #642).
        # `main` is branch-protected; pushing directly returns GH006. Push to
        # a stable branch and let CI run the protected checks via a PR.
        # `--no-verify` skips local git hooks (husky / lint-staged) so the
        # automated commit doesn't OOM on prettier across the staged set.
        env:
          # BOT_PR_TOKEN (fine-grained PAT, contents:write + pull-requests:write) re-triggers required checks; GITHUB_TOKEN cannot (anti-recursion). See ops-review bead claude-k0h2.
          # No fallback: the guard step at the top fails red when the secret is gone.
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/npm-stats"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-rebase onto current main so each daily run produces a clean diff
          # rather than stacking commits on a stale branch.
          git checkout -B "$BRANCH"

          git add marketplace/src/data/npm-stats.json marketplace/src/data/skills-stats.json marketplace/src/data/github-stats.json README.md
          git commit --no-verify -m "chore(marketplace-site): refresh daily npm download stats

          Auto-generated by .github/workflows/update-npm-stats.yml.

          jeremy made me do it
          -claude"

          git push --force-with-lease origin "$BRANCH"

          # `gh pr view <branch>` also matches MERGED/CLOSED PRs, so after the
          # first PR (#786) merged this check always "succeeded" and no new PR
          # was ever opened — main's npm-stats.json silently froze for 6 weeks
          # (estate audit finding F5). Only an OPEN PR counts.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            # Conventional-commit title: the commit-scope-check gate validates
            # PR titles, and the old emoji title failed it (PR #1290) — the
            # scheduled pipeline could open a PR that was unmergeable by
            # construction.
            gh pr create \
              --title "chore(marketplace-site): refresh daily npm download stats" \
              --head "$BRANCH" \
              --base main \
              --label "automated,stats" \
              --body "## Daily npm Download Stats

          Refreshes \`marketplace/src/data/npm-stats.json\` and the README \`NPM-STATS\` block with current download counts from npm.

          - **Source:** \`scripts/fetch-npm-stats.mjs\`
          - **Cadence:** daily at 00:15 UTC
          - **Idempotent:** re-running force-pushes \`automation/npm-stats\`; this PR auto-updates instead of stacking PRs.

          Safe to merge; no code changes, only data/markdown."
          fi

      - name: Summary
        run: |
          echo "## 📦 npm Stats Refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "✅ Stats changed; PR opened or updated on \`automation/npm-stats\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✓ No stats changes; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Alert Slack on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_OPERATION_HIRED_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_TEXT: 'update-npm-stats.yml failed; daily statistics did not complete.'
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Slack alert cannot be delivered: webhook is not configured."
            exit 1
          fi
          PAYLOAD=$(jq -n --arg text "$ALERT_TEXT <$RUN_URL|View run>" '{text: $text}')
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' --data "$PAYLOAD" \
            -- "$WEBHOOK" > /dev/null
          echo "Slack alert delivered."

name: 'CodeQL Security Analysis'

on:
  push:
    branches: ['main']
  # PR analysis covers first-party app, library, and repository automation code.
  # Current-main high findings in scripts/ proved that excluding automation leaves
  # security fixes unverifiable until after merge. Plugin mirrors remain outside
  # this path scope. Advisory only — never a required status check.
  pull_request:
    branches: ['main']
    paths:
      - 'packages/**'
      - 'marketplace/src/**'
      - 'scripts/**'
  # schedule disabled — burns Actions minutes
  # - cron: '0 6 * * 1'

concurrency:
  # #1450: a superseded push to a PR branch cancels its stale run; main and
  # scheduled runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript', 'python']
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Queries to run (security-extended includes more checks)
          queries: security-extended,security-and-quality

      # Autobuild attempts to build any compiled languages
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'

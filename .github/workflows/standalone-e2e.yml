name: Standalone E2E Harness

# Owns the repository-local plugin/skill/MCP harness under tests/e2e. The
# marketplace browser and deployed-site suites remain in e2e-tests.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'scripts/skill-frontmatter.mjs'
      - 'scripts/skill-frontmatter.d.mts'
      - 'scripts/vendor/js-yaml-4.1.1/**'
      - '.github/workflows/standalone-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'scripts/skill-frontmatter.mjs'
      - 'scripts/skill-frontmatter.d.mts'
      - 'scripts/vendor/js-yaml-4.1.1/**'
      - '.github/workflows/standalone-e2e.yml'

permissions:
  contents: read

concurrency:
  group: standalone-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: standalone-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml

      - name: Install frozen standalone dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Typecheck harness
        run: pnpm exec tsc --noEmit

      - name: Run standalone E2E suite
        run: pnpm test

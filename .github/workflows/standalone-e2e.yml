name: Standalone E2E Harness

# Owns the repository-local plugin/skill/MCP harness under tests/e2e. The
# marketplace browser and deployed-site suites remain in e2e-tests.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'scripts/skill-frontmatter.mjs'
      - 'scripts/skill-frontmatter.d.mts'
      - 'scripts/vendor/js-yaml-4.1.1/**'
      - '.github/workflows/standalone-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'scripts/skill-frontmatter.mjs'
      - 'scripts/skill-frontmatter.d.mts'
      - 'scripts/vendor/js-yaml-4.1.1/**'
      - '.github/workflows/standalone-e2e.yml'

permissions:
  contents: read

concurrency:
  group: standalone-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: standalone-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml

      - name: Install frozen standalone dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Typecheck harness
        run: pnpm exec tsc --noEmit

      - name: Run standalone E2E suite
        run: pnpm test

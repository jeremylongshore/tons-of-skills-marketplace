name: Publish changed @intentsolutionsio packages

# Runs after the canonical Validate Plugins workflow completes successfully on
# a push to main. For each
# changed plugin whose package.json `version` is not yet on npm:
#   1. Creates an annotated git tag of the form `<scope>/<name>@<version>`.
#   2. Opens a GitHub Release linked to that tag with auto-generated notes.
#   3. Publishes to npm with provenance only after the source-release tuple is
#      present. A tag/release failure therefore cannot leave an orphan npm
#      package version.
#
# The version-bump trigger is provided by `auto-bump-on-pr.yml` — it runs on
# every PR, detects which plugins' source files changed, bumps each plugin's
# patch version, and commits back to the PR branch. So the loop is:
#   PR opened → CI auto-bumps changed plugins → merge to main → Validate Plugins
#   completes → this workflow publishes + tags + releases.
#
# For intentional minor / major bumps, a human edits the version manually
# in the PR; the auto-bump bumper is idempotent (it skips PRs where only
# package.json changed) so the manual bump rides through clean.
#
# Only handles @intentsolutionsio/* scoped packages. Other packages (the 12
# pre-existing heterogeneous ones, plus packages/cli which has its own
# tag-based publish) are ignored here.

on:
  workflow_run:
    workflows: ['Validate Plugins']
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write # tag push + release creation
  id-token: write # npm provenance

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  guard:
    name: Guard — trusted Validate Plugins completion
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Check out trusted default-branch guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/publication-trigger-guard.mjs

      - name: Validate triggering workflow run
        id: guard
        env:
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/publication-trigger-guard.mjs "$EVENT_PATH" "$REPOSITORY" > /tmp/trigger-guard.json
          cat /tmp/trigger-guard.json
          ELIGIBLE=$(jq -r '.eligible' /tmp/trigger-guard.json)
          SHA=$(jq -r '.headSha // empty' /tmp/trigger-guard.json)
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  preflight:
    name: Exact-SHA required-check preflight
    runs-on: ubuntu-latest
    needs: guard
    if: ${{ needs.guard.outputs.eligible == 'true' }}
    steps:
      - name: Check out trusted preflight implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/npm-publication-preflight.mjs

      - name: Re-query required checks before any credential-capable job
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ needs.guard.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/npm-publication-preflight.mjs \
            --repo "$REPOSITORY" \
            --sha "$PUBLISH_SHA" \
            --timeout-seconds 120 \
            --poll-seconds 5 \
            --json

  detect:
    name: Detect changed plugin packages
    runs-on: ubuntu-latest
    needs: guard
    if: ${{ needs.guard.outputs.eligible == 'true' }}
    outputs:
      count: ${{ steps.build.outputs.count }}
      packages_json: ${{ steps.build.outputs.packages_json }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0

      - name: Build change list
        id: build
        run: |
          set -euo pipefail
          PUBLISH_SHA='${{ needs.guard.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          # Compare the exact published commit with its first parent. This
          # preserves files introduced by a merge commit and never resolves a
          # moving main branch.
          if git rev-parse "$PUBLISH_SHA^1" >/dev/null 2>&1; then
            git diff --name-only "$PUBLISH_SHA^1" "$PUBLISH_SHA" > /tmp/changed.txt
          else
            git diff-tree --root --no-commit-id --name-only -r "$PUBLISH_SHA" > /tmp/changed.txt
          fi
          # Map to plugin directories (plugins/<category>/<slug>/...)
          awk -F/ '/^plugins\// && NF>=3 {print $1"/"$2"/"$3}' /tmp/changed.txt | sort -u > /tmp/plugin-dirs.txt
          # Some plugin dirs are nested deeper (saas-packs/skill-databases/*) — handle
          awk -F/ '/^plugins\/saas-packs\/skill-databases\// && NF>=4 {print $1"/"$2"/"$3"/"$4}' /tmp/changed.txt | sort -u >> /tmp/plugin-dirs.txt
          sort -u -o /tmp/plugin-dirs.txt /tmp/plugin-dirs.txt

          echo "Changed plugin directories:"
          # The resolver walks actual filesystem ancestry. It is the only
          # publisher candidate authority: names, folder categories, and
          # private:false cannot override an upstream source record.
          node scripts/publish-candidate-report.mjs \
            --changed-files /tmp/changed.txt \
            --scope '@intentsolutionsio/' \
            --json > /tmp/publish-report.json
          jq -r '.mirrorSkipped[] | "Mirror skipped: \(.name) [\(.reasonCode)]"' /tmp/publish-report.json
          jq -r '.refused[] | "Refused: \(.name) [\(.reasonCode)]"' /tmp/publish-report.json
          jq -r '.firstPartyCandidates[] | "First-party candidate: \(.name)@\(.version)"' /tmp/publish-report.json
          jq -c '.firstPartyCandidates' /tmp/publish-report.json > /tmp/packages.json

          COUNT=$(jq length /tmp/packages.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "packages_json=$(jq -c . /tmp/packages.json)" >> "$GITHUB_OUTPUT"
          echo "Publish candidates: $COUNT"
          jq -r '.[] | "  \(.name)@\(.version)"' /tmp/packages.json

  publish:
    name: Publish candidates (skip if version already on npm)
    runs-on: ubuntu-latest
    needs: [guard, preflight, detect]
    if: ${{ needs.guard.outputs.eligible == 'true' && needs.preflight.result == 'success' && needs.detect.outputs.count != '0' }}
    environment: npm-production
    outputs:
      publication_report: ${{ steps.publish.outputs.publication_report }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git author for tag push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Assert source release before publishing each changed package
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_JSON: ${{ needs.detect.outputs.packages_json }}
          PUBLISH_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          PUBLISHED=0; SKIPPED=0; FAILED=0
          PUBLISHED_LIST=""
          PUBLISHED_JSON='[]'

          # Use a process-substitution loop so subshell counters survive.
          while read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            DIR=$(echo "$row" | jq -r '.dir')
            VERSION=$(echo "$row" | jq -r '.version')
            # Tag form: `@scope/name@version` — the convention used by lerna,
            # turborepo, and changesets-managed monorepos. Distinguishable
            # from the legacy repo-wide `vN.M.O` tags.
            TAG="${NAME}@${VERSION}"

            # Does this exact version already exist on npm?
            ENC=$(echo "$NAME" | sed 's/@/%40/;s|/|%2F|')
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/$ENC/$VERSION")
            if [ "$HTTP" = "200" ]; then
              echo "⊙ skip (already published): $NAME@$VERSION"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            # Annotated tag with body that links to npm + the source dir.
            TAG_MSG="Release ${NAME} ${VERSION}\n\nnpm: https://www.npmjs.com/package/${NAME}/v/${VERSION}\nsource: ${DIR}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "  ⊙ tag $TAG already exists locally; skipping tag step"
            else
              git tag -a "$TAG" -m "$(printf "%b" "$TAG_MSG")"
              git push origin "refs/tags/${TAG}"
            fi

            # GitHub Release with auto-generated notes (PR + commit summaries
            # since the previous tag for this package). `--generate-notes`
            # uses the repo's release-notes config or falls back to default.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "  ⊙ release $TAG already exists; skipping"
            else
              # Build the notes via printf to avoid multi-line YAML literal
              # block scalar issues (blank-line-then-unindented breaks YAML
              # parsing).
              # shellcheck disable=SC2016  # backticks are literal markdown code spans
              REL_NOTES=$(printf 'Released by `publish-changed-packages.yml` on push to `main`.\n\n**npm:** https://www.npmjs.com/package/%s/v/%s\n**Source:** `%s`\n**Install:** `pnpm add %s@%s` (or `/plugin install` via Claude Code marketplace)' "$NAME" "$VERSION" "$DIR" "$NAME" "$VERSION")
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "$REL_NOTES" \
                --generate-notes
            fi

            # Re-query both source-release components immediately before the
            # irreversible npm publish. Do not rely on the earlier branch:
            # a concurrent deletion or API failure must fail this run.
            git rev-parse -q --verify "refs/tags/${TAG}^{tag}" >/dev/null
            gh release view "$TAG" >/dev/null

            if ! (cd "$DIR" && npm publish --access public --provenance); then
              echo "❌ FAILED publish: $NAME@$VERSION — source release remains visible; investigate and bump patch to retry"
              FAILED=$((FAILED+1))
              sleep 2
              continue
            fi
            echo "✓ published: $NAME@$VERSION"
            PUBLISHED=$((PUBLISHED+1))
            PUBLISHED_LIST="${PUBLISHED_LIST}\n  - ${NAME}@${VERSION}"
            PUBLISHED_JSON=$(jq -cn \
              --argjson prior "$PUBLISHED_JSON" \
              --arg name "$NAME" --arg version "$VERSION" --arg tag "$TAG" --arg package_path "$DIR" \
              '$prior + [{channel:"npm", name:$name, version:$version, release_tag:$tag, package_path:$package_path}]')

            sleep 2
          done < <(echo "$PACKAGES_JSON" | jq -c '.[]')

          echo ""
          echo "Summary: published=$PUBLISHED skipped=$SKIPPED failed=$FAILED"
          if [ "$PUBLISHED" -gt 0 ]; then
            echo ""
            echo "Published in this run:"
            printf '%b\n' "$PUBLISHED_LIST"
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          if [ "$PUBLISHED" -gt 0 ]; then
            printf '%s' "$PUBLISHED_JSON" > /tmp/completed-publications.json
            node scripts/build-publication-report.mjs \
              --completed /tmp/completed-publications.json \
              --out /tmp/publication-report.json \
              --sbom-dir /tmp/publication-sboms
            echo "publication_report=$(jq -c . /tmp/publication-report.json)" >> "$GITHUB_OUTPUT"
          fi

  emit-publication-evidence:
    name: Emit signed evidence for every completed package publication
    needs: [guard, publish]
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.publication_report != '' }}
    uses: ./.github/workflows/emit-publication-evidence.yml
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    with:
      source_sha: ${{ needs.guard.outputs.sha }}
      publication_report: ${{ needs.publish.outputs.publication_report }}

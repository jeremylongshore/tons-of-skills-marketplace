name: Sync External Plugins

on:
  # Weekly cron — Mondays 06:00 UTC. Authors using sources.yaml get their
  # latest pulled in once a week without any human action. Re-enabled
  # 2026-05-31 after audit found 16 sources.yaml entries that never reached
  # the catalog because the prior daily cron was disabled. Weekly is a
  # cheaper cadence than daily; if it proves too slow for active authors,
  # bump to twice-weekly or back to daily.
  schedule:
    - cron: '0 6 * * 1'

  repository_dispatch:
    types: [external-plugin-sync]

  workflow_dispatch:
    inputs:
      # NOTE: there is deliberately no `force` input. Every run passes --force
      # unconditionally (see the Run-sync-script step) — the mirror-by-default
      # model re-syncs full upstream each run, and sync-external.mjs documents
      # that --force does NOT bypass the sources.lock drift quarantine or the
      # curated: freeze. A previous `force` toggle here was dead UI: the
      # unconditional --force below overrode it either way (ops-review bead
      # claude-k0h2, P3 dead-input finding).
      source:
        description: 'Sync only this source (leave empty for all)'
        type: string
        default: ''
      dry_run:
        description: 'Dry run - show what would change without making changes'
        type: boolean
        default: false
      relock:
        description: >-
          Approve drifted source(s) after HUMAN review of the upstream diff:
          comma-separated source names, or "all". Re-baselines their
          sources.lock.json entries and mirrors their current upstream state.
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

# Serialize sync runs so a weekly cron + a repository_dispatch (or two
# dispatches) never execute concurrently. Combined with the unique per-run
# branch in the Create-PR step, this guarantees no run can clobber another's
# in-flight work. Do NOT cancel-in-progress: a half-finished sync should
# complete and open its PR rather than be killed mid-write.
concurrency:
  group: sync-external
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync from external repos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # BOT_PR_TOKEN (fine-grained PAT, contents:write + pull-requests:write) re-triggers required checks; GITHUB_TOKEN cannot (anti-recursion). See ops-review bead claude-k0h2.
          # This persisted credential authenticates the `git push origin "$BRANCH"`
          # in the Create-PR step below. Falls back to GITHUB_TOKEN (today's
          # behavior) until the BOT_PR_TOKEN secret exists.
          token: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Astro requires >=22.12.0 as of 2026-05-30; sync runs
          # sync-marketplace.cjs which the build pipeline expects on 22+.
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version is read from package.json `packageManager` field
        # (specifying both `version: 9` and `packageManager` causes pnpm/action-setup
        # to error with ERR_PNPM_BAD_PM_VERSION)

      - name: Install dependencies
        # js-yaml is already in devDependencies; just install the workspace.
        # Previously this was `pnpm add js-yaml` which fails with
        # ERR_PNPM_ADDING_TO_ROOT once the repo is a real workspace.
        run: pnpm install --frozen-lockfile

      - name: Run sync script
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Injection hygiene: dispatch-controlled strings must reach the shell
          # via env vars, never via direct ${{ }} interpolation inside run:.
          # A crafted repository_dispatch client_payload.source would otherwise
          # be expanded verbatim into the script (command execution on the
          # runner). Env values arrive as data, not code.
          SYNC_SOURCE: ${{ inputs.source || github.event.client_payload.source }}
          # Same injection hygiene as SYNC_SOURCE: workflow_dispatch-only (a
          # repository_dispatch payload can NOT relock — approval stays a
          # deliberate human action in the Actions UI).
          SYNC_RELOCK: ${{ inputs.relock }}
        run: |
          ARGS=()
          # Source arrives via the SYNC_SOURCE env var (declared above) so the
          # payload is data, never script text; appended as one argv entry so
          # metacharacters / spaces stay a single argument.
          if [ -n "$SYNC_SOURCE" ]; then
            ARGS+=("--source=$SYNC_SOURCE")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          # Drift approval: "all" → --relock-all, else one --relock=<name>
          # per comma-separated entry (whitespace trimmed), each as one argv.
          if [ "$SYNC_RELOCK" = "all" ]; then
            ARGS+=(--relock-all)
          elif [ -n "$SYNC_RELOCK" ]; then
            IFS=',' read -r -a RELOCKS <<< "$SYNC_RELOCK"
            for r in "${RELOCKS[@]}"; do
              r="${r//[[:space:]]/}"
              if [ -n "$r" ]; then
                ARGS+=("--relock=$r")
              fi
            done
          fi
          # --force is ALWAYS on by design: every run is a full re-sync of
          # current upstream (the pileup auto-close + unique-per-run-branch
          # model depends on that), and sync-external.mjs itself documents
          # "the weekly workflow always passes --force" — it does NOT bypass
          # the drift quarantine or the curated: freeze (sync-external.mjs
          # --force docs + drift-gate NOTE). The old workflow_dispatch `force`
          # toggle was dead UI on top of this line and has been removed.
          ARGS+=(--force --verbose)

          node scripts/sync-external.mjs "${ARGS[@]}"

      # A freshly-synced source drops a new plugin dir with a .source.json
      # marker; its mirrored markdown/python must be excluded from this repo's
      # lint gates or the very next CI run red-fails on content we don't own.
      # Run the generator in WRITE mode here — right after the sync writes files
      # and BEFORE the change-detection / commit steps below — so the new
      # exclusion self-registers in .markdownlint-cli2.jsonc + ruff.toml and
      # rides along in the same auto-PR. (Skipped on dry-run and on a partial
      # sync, matching the commit/PR gating downstream.)
      - name: Sync lint-ignore exclusions
        if: inputs.dry_run != true && steps.sync.outputs.errors == '0'
        run: node scripts/sync-lint-ignores.mjs

      # Supply-chain gate on the freshly-mirrored content BEFORE it is committed
      # and auto-PR'd. A compromised/rogue upstream's next push lands here as
      # untracked/modified files under plugins/**; this scans exactly that diff
      # (--base HEAD picks up the working-tree changes the sync just wrote) and
      # HARD-fails on a REFUSE finding (pipe-to-shell in a script, reverse shell,
      # decode-then-exec, secret exfil, crypto-miner) — so a poisoned upstream
      # fails the sync itself and no PR is opened. --warn-only means dual-use
      # CHALLENGE findings (a new hook, a remote MCP url, an outbound call) do
      # NOT halt the weekly sync on routine upstream churn; they still print here
      # and are re-graded (blocking) on the resulting PR for a human to sign off.
      # A failed step halts the job, so the commit/PR-create steps below never run.
      - name: Scan synced content for injected payloads
        if: inputs.dry_run != true && steps.sync.outputs.errors == '0'
        run: node scripts/scan-synced-content.mjs --changed-only --base HEAD --warn-only

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync marketplace catalog
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true && steps.sync.outputs.errors == '0'
        # Use --no-frozen-lockfile here intentionally: the sync step above can
        # overwrite synced plugins' package.json from upstream, which legitimately
        # diverges from the committed pnpm-lock.yaml. The auto-PR this workflow
        # creates is reviewable, so allowing lockfile updates is safe.
        run: |
          pnpm install --no-frozen-lockfile
          # Full derivation, not just the CLI catalog: `pnpm run sync-marketplace`
          # also runs generate-plugin-package-jsons.mjs (a freshly-synced plugin
          # needs its package.json for the catalog-invariant gate) and
          # generate-readme-toc.mjs (the README AUTO-TOC must include the new
          # entry or the "Verify README TOC" gate fails). Running only
          # sync-marketplace.cjs skipped both and red-failed every new plugin.
          pnpm run sync-marketplace

      - name: Close superseded sync PRs
        # Keep at most ONE open sync PR. Each run opens a fresh unique per-run
        # branch (automation/sync-external-<run_id>); this run's mirror is a full
        # re-sync of current upstream, so ANY older still-open sync PR is
        # redundant. Close them (and delete their branch) BEFORE opening this
        # run's PR, so the backlog can never stack again. Nothing unique is lost:
        # a sync PR is regenerated wholesale each run. Gated identically to the
        # Create-PR step below so we only supersede when a replacement is actually
        # being opened. Preserves the safe per-run-branch model (which fixed the
        # earlier shared-branch clobber, 000-docs/691-AT-AUDT); this step only
        # prunes the pileup that model produced. See 000-docs AT-DECR
        # (mirror-by-default external-plugin sync model).
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true && steps.sync.outputs.errors == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/sync-external-")) | .number' \
          | while read -r num; do
              [ -z "$num" ] && continue
              echo "Closing superseded sync PR #$num"
              gh pr close "$num" \
                --comment "Superseded by a newer external-plugin sync run — each run mirrors the full current upstream, so this PR is redundant. Closing to keep at most one open sync PR (automated by \`sync-external.yml\`)." \
                --delete-branch || true
            done

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true && steps.sync.outputs.errors == '0'
        # Hand-rolled commit + push + PR-create instead of peter-evans/create-pull-request.
        #
        # Why: sync diffs are large (hundreds of files / 100K+ lines from upstream
        # restructures). peter-evans triggers the repo's husky pre-commit hook, which
        # runs prettier across the whole staged set and either OOMs or hangs for 15+
        # minutes. The HUSKY=0 env var doesn't reliably suppress git hooks — and
        # `git commit --no-verify` does, with no extra moving parts. Six bash lines
        # are easier to debug than a third-party action's internal commit pipeline.
        env:
          # BOT_PR_TOKEN (fine-grained PAT, contents:write + pull-requests:write) re-triggers required checks; GITHUB_TOKEN cannot (anti-recursion). See ops-review bead claude-k0h2.
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Unique per-run branch. Fixes three bugs at once:
          #  - no force-push of a SHARED branch, so a concurrent/later sync run
          #    can't clobber an in-flight PR (the bug that wiped the beads-dolt PR);
          #  - the `automation/` prefix makes auto-bump-on-pr.yml skip the PR, so
          #    synced plugin versions no longer drift vs their catalog entry;
          #  - a unique name can never match an OLD merged PR, so the gh-pr-view
          #    guard below reliably opens a fresh PR instead of stranding the sync.
          BRANCH="automation/sync-external-${{ github.run_id }}"

          # Configure committer identity for the automated commit
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"

          # Stage everything the sync wrote, then commit WITHOUT running pre-commit
          # hooks (--no-verify). The auto-PR runs through normal CI on the PR side
          # ONLY when BOT_PR_TOKEN is set — a GITHUB_TOKEN-authored push fires no
          # pull_request events, so ci-required/gitleaks sit "Expected" and the PR
          # needs a manual owner empty-commit to wake the checks.
          git add -A
          git commit --no-verify -m "chore(sync): update external plugins from upstream

          Automated sync from external plugin sources.
          See sources.yaml for configured sources."

          git push origin "$BRANCH"

          # Open the PR. The per-run branch is unique, so this guard never matches
          # a prior PR (the old reuse bug matched an already-MERGED PR on the
          # shared branch and silently skipped creation, stranding the sync).
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --title "chore(external-sync): mirror upstream external plugins" \
              --head "$BRANCH" \
              --base main \
              --label "automated,sync,external-plugins" \
              --body "## Automated External Plugin Sync

          This PR syncs the latest changes from external plugin sources.

          ### Sources
          See [\`sources.yaml\`](../blob/main/sources.yaml) for the list of synced repositories.

          ### Review Checklist
          - [ ] Changes look correct
          - [ ] No sensitive data included
          - [ ] Plugin validation passes

          ---
          *This PR was automatically created by the \`Sync External Plugins\` workflow.*"
          fi

      # A partial sync (one or more sources errored / found zero files) must NOT
      # be committed and auto-PR'd as if it were a clean full sync. The commit +
      # PR steps above are already gated on `errors == '0'`; this step makes the
      # partial run visibly RED and names the failed sources so a human can act.
      - name: Flag partial sync
        if: steps.sync.outputs.errors != '0' && steps.sync.outputs.errors != ''
        # Source-name outputs go through env:, never ${{ }} inside run:. They
        # are built from the `name:` fields in sources.yaml, which external
        # contributors submit PRs against, so a name containing a quote or
        # backtick would be executed rather than echoed. Same class as
        # f-ccp-workflows-1; pinned by tests/ci/test_workflow_injection_hygiene.py.
        env:
          ERRORS: ${{ steps.sync.outputs.errors }}
          FAILED_SOURCES: ${{ steps.sync.outputs.failed_sources }}
        run: |
          {
            echo "## ⚠️ Partial external sync — needs human"
            echo ""
            echo "$ERRORS source(s) errored; no PR was opened."
            echo "Failed: $FAILED_SOURCES"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Partial external sync ($FAILED_SOURCES) — investigate before re-running."
          exit 1

      # A locked source whose upstream content drifted from the committed
      # sources.lock.json baseline was QUARANTINED by the sync engine (nothing
      # of it mirrored). The load-bearing invariant for the gating below is that
      # a drifted source writes NOTHING — in scripts/sync-external.mjs, the
      # guard
      #
      #     if (lockDiff.status === 'drifted' && !relockRequested) { ... return
      #     { source, changes: [], lockStatus: 'quarantined', ... } }
      #
      # short-circuits unconditionally at the TOP of the per-source body, before
      # any copy/write call, so drifted bytes never reach the working tree.
      # tests/ci/test_sync_external_gating.py pins this — if someone ever moves
      # a write above that early return, the test fails rather than this
      # workflow silently shipping drifted content.
      #
      # Drift therefore quarantines ONLY the drifted source, exactly like the
      # REFUSE path below: the clean co-synced sources still ship their PR, and
      # this step runs AFTER it to make the run visibly RED and name the drifted
      # sources. A human reviews each upstream diff, then approves via
      # workflow_dispatch with relock=<names> (or relock=all).
      #
      # The commit/PR steps were previously ALSO gated on `quarantined == '0'`.
      # That gate protected nothing — the drifted files were never written, so
      # they could not ride into the PR — while blocking every OTHER source's
      # legitimately-mirrored content. One drifted source halted all 63.
      #
      # It did exactly that: `slack-channel` drifted and the sync failed on
      # EVERY run from 2026-07-20 to 2026-08-09 — seven consecutive runs, all
      # failing at "Flag quarantined drift", with the last success on
      # 2026-07-17. Nothing mirrored for 23 days. The UIZZE plugin (#1104) was accepted on 2026-07-25 and still did
      # not exist on the site when the outage was found — the contributor saw
      # their submission merged and then vanish. The failure was loud in the
      # Actions tab and observed by nobody, which is the actual lesson.
      # See #1164.
      - name: Flag quarantined drift
        if: steps.sync.outputs.quarantined != '0' && steps.sync.outputs.quarantined != ''
        # Source names via env: — see the note on "Flag partial sync" above.
        env:
          QUARANTINED: ${{ steps.sync.outputs.quarantined }}
          QUARANTINED_SOURCES: ${{ steps.sync.outputs.quarantined_sources }}
        run: |
          {
            echo "## 🔒 Upstream drift quarantined — needs human review"
            echo ""
            echo "$QUARANTINED source(s) drifted from their sources.lock.json baseline. NOTHING of theirs was mirrored."
            echo "Drifted: $QUARANTINED_SOURCES"
            echo ""
            echo "The clean co-synced sources shipped their PR normally — only the drifted source(s) above are held back."
            echo ""
            echo "Review each upstream diff, then re-run this workflow (workflow_dispatch) with \`relock\` set to the approved source names (comma-separated) or \`all\`."
            echo "Until then those source(s) stay frozen at their locked baseline and every run will red-fail here."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Drift quarantined ($QUARANTINED_SOURCES) — review upstream diffs, then approve via the relock input."
          exit 1

      # A source was REFUSED by the sync-time supply-chain scanner (blocker
      # 62ye.2): high-confidence malicious content (e.g. a pipe-to-shell or
      # reverse shell in an auto-executing file). Unlike drift, a REFUSE
      # quarantines ONLY the offending source — nothing of it was mirrored, and
      # the commit/PR steps are NOT gated on `refused`, so the clean co-synced
      # sources still shipped their PR. This step runs AFTER that PR is opened
      # and makes the run visibly RED so the malicious upstream gets a human
      # security review (the excluded source, not the clean PR, is the concern).
      - name: Flag REFUSED sources (supply-chain security event)
        if: steps.sync.outputs.refused != '0' && steps.sync.outputs.refused != ''
        # Source names via env: — see the note on "Flag partial sync" above.
        env:
          REFUSED: ${{ steps.sync.outputs.refused }}
          REFUSED_SOURCES: ${{ steps.sync.outputs.refused_sources }}
        run: |
          {
            echo "## ⛔ Source REFUSED — malicious content quarantined (security review)"
            echo ""
            echo "$REFUSED source(s) tripped a REFUSE grade in the sync-time payload scanner; NONE of their content was mirrored."
            echo "Refused: $REFUSED_SOURCES"
            echo ""
            echo "Clean co-synced sources shipped their PR normally. Investigate each refused upstream (a pipe-to-shell / reverse-shell / exfil pattern in an auto-executing file) before re-enabling it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Source REFUSED ($REFUSED_SOURCES) — malicious content excluded from the mirror; review the upstream."
          exit 1

      - name: Summary
        run: |
          echo "## 🔄 External Plugin Sync Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "✅ Changes detected and PR created" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✓ All sources are up to date" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Failure alerting (Slack-only, per the /slack skill convention) ────────
      # This workflow had NO failure alerting, which is why a drift quarantine
      # could red-fail every run from 2026-07-20 to 2026-08-09 (23 days) while
      # 63 sources silently stopped mirroring. The run was loud in the Actions
      # tab the whole time; nobody reads the Actions tab of a weekly cron.
      #
      # A scheduled job with no alert on failure is indistinguishable from one
      # that is not running at all. Modeled on promote-curated.yml. See #1164.
      - name: Alert Slack on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_OPERATION_HIRED_WEBHOOK_URL }}
          # Passed through the environment, NOT interpolated into the run:
          # script. `${{ }}` expands before bash parses the line, so a source
          # name containing a quote or backtick would be executed rather than
          # quoted — the standard GitHub Actions script-injection vector. These
          # values originate in sources.yaml, which external contributors submit
          # PRs against, so they are attacker-influenced by design.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUARANTINED_SOURCES: ${{ steps.sync.outputs.quarantined_sources }}
          REFUSED_SOURCES: ${{ steps.sync.outputs.refused_sources }}
        run: |
          # Strict shell, matching the other multi-command steps in this file.
          # Without -o pipefail a failure inside the PAYLOAD=$(python3 ...)
          # substitution would be swallowed and curl would post a malformed
          # body, turning a failed alert into a silently successful step —
          # the precise class of silence this alert exists to end.
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_OPERATION_HIRED_WEBHOOK_URL not set; skipping alert."
            exit 0
          fi
          PAYLOAD=$(python3 - "$RUN_URL" "$QUARANTINED_SOURCES" "$REFUSED_SOURCES" <<'PY'
          import json, sys
          run_url, quarantined, refused = sys.argv[1], sys.argv[2], sys.argv[3]
          detail = ""
          if quarantined:
              detail += f"\n• Drift quarantined: `{quarantined}` — review the upstream diff, then re-run with `relock` set."
          if refused:
              detail += f"\n• *REFUSED (supply-chain)*: `{refused}` — malicious content excluded; investigate the upstream."
          if not detail:
              detail = "\n• No source was quarantined or refused — the job failed for another reason."
          text = (
              "⚠️ *sync-external.yml failed* — external plugin mirroring did not "
              f"complete.{detail} <@U099CBRE7CL> <{run_url}|View run>"
          )
          print(json.dumps({"text": text}))
          PY
          )
          curl --silent --show-error --fail \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            -- "$WEBHOOK" > /dev/null
          echo "✓ Slack failure alert posted."

name: Capture Marketplace Compliance Baseline

on:
  workflow_dispatch:
    inputs:
      capture_mode:
        description: Full current capture, or expand only original pinned section debt
        type: choice
        default: capture
        options:
          - capture
          - historical-section-identities-v2

permissions: {}

jobs:
  capture:
    name: capture-baseline-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
      base_sha: ${{ steps.commit.outputs.base_sha }}
    steps:
      - name: Authorize an owner dispatch from the protected default branch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
          test "$REF_NAME" = "$DEFAULT_BRANCH"

      - name: Check out the requested quiet tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python3 -m pip install --quiet pyyaml

      - name: Refuse a non-quiet capture tree
        run: git diff --quiet && git diff --cached --quiet

      - name: Emit the triple-keyed marketplace baseline
        env:
          CAPTURE_MODE: ${{ inputs.capture_mode || 'capture' }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/marketplace-baseline-candidate.json"
          case "$CAPTURE_MODE" in
            capture)
              version="$(python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('scripts/.marketplace-compliance-baseline.json').read_text())
          version = baseline.get('finding_identity_version', 1)
          if type(version) is not int or version not in (1, 2):
              raise ValueError('unsupported pinned finding identity version')
          print(version)
          PY
              )"
              python3 scripts/validate-skills-schema.py --emit-baseline \
                --baseline-identity-version "$version" > "$candidate"
              ;;
            historical-section-identities-v2)
              python3 scripts/migrate-marketplace-section-identities.py > "$candidate"
              ;;
            *)
              echo 'Unsupported baseline capture mode' >&2
              exit 1
              ;;
          esac
          cp "$candidate" scripts/.marketplace-compliance-baseline.json

      - name: Refuse any generated diff outside the pinned baseline
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | cut -c4-)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "scripts/.marketplace-compliance-baseline.json"

      - name: Stage the immutable capture artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/marketplace-compliance-baseline/scripts"
          cp scripts/.marketplace-compliance-baseline.json \
            "$RUNNER_TEMP/marketplace-compliance-baseline/scripts/.marketplace-compliance-baseline.json"

      - name: Upload the immutable capture artifact
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-compliance-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/marketplace-compliance-baseline
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Commit the dedicated baseline branch
        id: commit
        run: |
          set -euo pipefail
          branch="automation/compliance-baseline-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add scripts/.marketplace-compliance-baseline.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(ci): capture marketplace compliance baseline'
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  open-pr:
    name: open-baseline-pull-request
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the owner-dispatched baseline pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          BRANCH: ${{ needs.capture.outputs.branch }}
          BASE_SHA: ${{ needs.capture.outputs.base_sha }}
          CAPTURE_MODE: ${{ inputs.capture_mode || 'capture' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title 'chore(ci): capture marketplace compliance baseline' \
            --body "Owner-dispatched CI baseline transaction (${CAPTURE_MODE}) from quiet tree ${BASE_SHA}. This PR intentionally changes only scripts/.marketplace-compliance-baseline.json. Historical section migration expands only debt evidenced at its original capture; it does not capture current debt. Required CI verifies the owner-run identity, successful capture job, source commit, and byte-identical immutable artifact before permitting growth; no human review gate is required."

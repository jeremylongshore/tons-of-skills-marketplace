name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.new_version.outputs.version }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
      publication_report: ${{ steps.publication_report.outputs.publication_report }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Release verification follows the full-repository Node contract.
          node-version: '22'

      - name: Check repository Node.js runtime
        run: node scripts/check-node-version.mjs

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Run validation tests
        run: |
          # scripts/validate-all.sh + test-installation.sh were removed; the full
          # gate now runs in CI (the ci-required aggregate on every PR + on push
          # to main, which is where releases are cut from). This step re-runs the
          # two deterministic, self-contained validators as a release smoke check.
          echo "Running plugin schema validation (standard tier)…"
          python3 scripts/validate-skills-schema.py --standard
          echo "Validating catalog invariants…"
          python3 scripts/validate-catalog-invariants.py

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.current }}"
          BUMP_TYPE="${{ inputs.bump_type }}"

          IFS='.' read -ra PARTS <<< "$CURRENT"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update version in marketplace.json
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          jq --arg version "$NEW_VERSION" '.metadata.version = $version' .claude-plugin/marketplace.json > tmp.json
          mv tmp.json .claude-plugin/marketplace.json

          echo "Updated marketplace.json to version $NEW_VERSION"
          jq '.metadata.version' .claude-plugin/marketplace.json

      - name: Update version in README
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          sed -i "s/Version: [0-9.]\+/Version: $NEW_VERSION/" README.md
          sed -i "s/Last Updated: [0-9-]\+/Last Updated: $(date +%Y-%m-%d)/" README.md
          echo "Updated README.md version references"

      - name: Commit version bump
        id: release_commit
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .claude-plugin/marketplace.json README.md
          git commit -m "chore: bump version to v$NEW_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Extract changelog section for this version
          awk "/## \[$NEW_VERSION\]/,/## \[/ { print }" CHANGELOG.md > release-notes.txt || echo "Release v$NEW_VERSION" > release-notes.txt

          git tag -a "v$NEW_VERSION" -F release-notes.txt
          echo "Created tag v$NEW_VERSION"

      - name: Push changes and tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Extract changelog for release notes
          awk "/## \[$NEW_VERSION\]/,/## \[/ { print }" CHANGELOG.md > release-notes.txt || true

          if [ ! -s release-notes.txt ]; then
            echo "# Release v$NEW_VERSION" > release-notes.txt
            echo "" >> release-notes.txt
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/000-docs/247-OD-CHNG-changelog.md) for details." >> release-notes.txt
          fi

          gh release create "v$NEW_VERSION" \
            --title " Release v$NEW_VERSION" \
            --notes-file release-notes.txt \
            --latest

      - name: Build marketplace release SBOM and signed-evidence input
        id: publication_report
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          jq -cn --arg version "${{ steps.new_version.outputs.version }}" \
            '[{channel:"github-release", name:"tons-of-skills-marketplace", version:$version, release_tag:("v" + $version), package_path:"."}]' > /tmp/completed-publications.json
          node scripts/build-publication-report.mjs --completed /tmp/completed-publications.json --out /tmp/publication-report.json --sbom-dir /tmp/publication-sboms
          echo "publication_report=$(jq -c . /tmp/publication-report.json)" >> "$GITHUB_OUTPUT"

      - name: Create release announcement issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          gh issue create \
            --title " Release v$NEW_VERSION Available" \
            --body "We're excited to announce v$NEW_VERSION!

          ##  What's New
          See the [full changelog](https://github.com/${{ github.repository }}/blob/main/000-docs/247-OD-CHNG-changelog.md#${NEW_VERSION//.}-$(date +%Y-%m-%d)) for all details.

          ##  Installation
          \`\`\`bash
          /plugin marketplace add jeremylongshore/claude-code-plugins
          \`\`\`

          ##  Feedback
          Share your thoughts in [discussions](https://github.com/${{ github.repository }}/discussions)!" \
            --label "announcement,release"

      - name: Summary
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          {
            echo "## Release v$NEW_VERSION Complete! "
            echo ""
            echo "-  Version bumped: ${{ steps.current_version.outputs.current }} → $NEW_VERSION"
            echo "-  Git tag created: v$NEW_VERSION"
            echo "-  GitHub release published"
            echo "-  Announcement issue created"
            echo ""
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v$NEW_VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"

  emit-publication-evidence:
    name: Emit signed evidence for the completed marketplace release
    needs: release
    uses: ./.github/workflows/emit-publication-evidence.yml
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    with:
      source_sha: ${{ needs.release.outputs.release_sha }}
      publication_report: ${{ needs.release.outputs.publication_report }}

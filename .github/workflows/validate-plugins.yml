        run: pip install 'ruff==0.15.22'

      # BLOCKING — 374 files formatted at PR #765 baseline.
      # Run `ruff format plugins/ scripts/` locally to fix before pushing.
      - name: Check ruff formatting
        run: ruff format --check plugins/ scripts/ freshie/scripts/doltlite-sync.py tests/test_doltlite_sync.py

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Synced-plugin lint exclusions must be present BEFORE markdownlint runs,
      # so a new external-synced plugin fails here with an actionable "run this
      # generator" message instead of a cryptic markdownlint error on mirrored
      # content the next sync overwrites anyway. Also guards ruff.toml. The
      # generator (sync-lint-ignores.mjs) derives the exclusion lists from the
      # .source.json-marked dirs; --check fails on drift and names the fix.
      - name: Check synced-plugin lint exclusions
        run: node scripts/sync-lint-ignores.mjs --check

      # BLOCKING — codebase passed baseline at PR #772 (2026-05-23).
      # Cleanup arc: 60,000 → 80 (PR #767 bulk-fix) → 0 (this PR).
      # Final cleanup fixed:
      #   - 21 broken TOC anchors in 3 wondelai case-studies (GitHub slug
      #     mismatch with em-dash titles — regenerated link targets)
      #   - 13 more broken anchors in design + ai-ml-engineering-pack
      #   - 2 missing-section TOC entries in ai-ml USE_CASES.md
      #   - 8 MD056 table column-count: `|` chars inside backtick code
      #     spans (regex, set union) → escaped to `\|`
      #   - 4 MD056 real column mismatches (added/split header columns)
      #   - 7 MD001 heading-increment (h4 → h3 demotions)
      #   - 4 MD003 setext → atx (force-blank-line, language-tag fences,
      #     wrap YAML frontmatter examples in code fences)
      #   - 3 MD045 missing alt-text on shield badges (added alt=)
      #   - 6 MD046 indented-code-blocks in nested-list contexts and
      #     malformed-fence files (per-file MD046-disable on the 3
      #     deprecated commands/ files where fixing structurally
      #     would risk breaking the example output)
      # .markdownlint-cli2.jsonc at repo root governs rule selection.
      - name: Run markdownlint-cli2
        run: |
          npx -y markdownlint-cli2

  # Supply-chain scanner over the mirrored plugin content changed in this PR.
  # This is the PR-side twin of the scan step inside sync-external.yml: the
  # weekly sync opens an auto-PR, and this job re-grades that PR's plugin diff so
  # an injected payload is caught even if the sync-side step was bypassed (e.g. a
  # hand-pushed change to plugins/**). Runs on every PR (no path filter, so a
  # required-status entry never hangs "Expected forever" on a PR that doesn't
  # touch plugins/); it scopes internally to changed files under plugins/**.
  #   REFUSE (pipe-to-shell in a script, reverse shell, decode-then-exec, secret
  #   exfil, crypto-miner) → exit 2, fails the job. CHALLENGE (dual-use: hooks,
  #   remote MCP url, outbound calls, dynamic exec) → exit 1, fails the job UNLESS
  #   a `path:rule  reason` waiver is added to scripts/scan-allowlist.txt in the
  #   same PR. The bot's own sync PR (branch automation/sync-external-*) runs with
  #   --warn-only so routine dual-use churn doesn't wall it — REFUSE still blocks.
  scan-synced-content:
    runs-on: ubuntu-latest
    name: scan-synced-content (supply-chain)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run scanner + its fixture corpus
        run: node --test scripts/scan-synced-content.test.mjs

      - name: Scan changed plugin content
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # The bot's own sync PR already REFUSE-scanned upstream at sync time;
          # re-grade it with --warn-only so dual-use CHALLENGE churn doesn't wall
          # the automated PR (REFUSE still hard-blocks). Human PRs get full grading.
          WARN=""
          case "$HEAD_REF" in
            automation/sync-external-*) WARN="--warn-only" ;;
          esac
          node scripts/scan-synced-content.mjs --changed-only --base "origin/$BASE_REF" $WARN

      # E4.7 (blueprint 727): the workflow already fires on push:main, but the
      # scan above skipped itself outside pull_request — so nothing ever
      # scanned what actually LANDED on main (admin merges, direct pushes).
      # Scan the push range with FULL grading — no --warn-only on main: main
      # is the trust boundary, and REFUSE stays exit 2 and unwaivable.
      # Residual (stated per the bead's acceptance): enforce_admins:false
      # means an admin can still merge past a red aggregate; this step makes
      # that visible on main rather than silent, it cannot make it impossible.
      - name: Scan pushed plugin content (push to main)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="$BEFORE"
          # A forced or branch-creation push reports an all-zero or unknown
          # `before`; fall back to the parent commit so the scan still judges
          # the newest change rather than silently passing.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          node scripts/scan-synced-content.mjs --changed-only --base "$BASE"

  # skills/.curated/ is a GENERATED mirror of the repo's best (A/B) plugin skills,
  # rebuilt from freshie/grades.csv by freshie/scripts/promote-to-curated.py so
  # skills.sh can index them (its crawler only reads root skills/ / .curated/, not
  # plugins/**/skills/). This gate fails a PR that edits a promoted source skill
  # without regenerating the mirror — exactly like the README AUTO-TOC --check.
  # It is git-only + Python-stdlib (no validator, no sqlite, no node_modules), so
  # it is deterministic and cannot false-drift on a missing kernel schema. Full
  # selection refresh (newly-A skills, sources dropped below B) is the weekly
  # promote-curated.yml workflow's job, not this per-PR check.
  promote-curated-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify skills/.curated/ mirror is in sync with its plugin sources
        run: python3 freshie/scripts/promote-to-curated.py --check

  # Submission-documents intake gate (000-docs/700-DR-GUID-skill-submission-standard.md).
  # A PR that adds a NEW plugin directory (its .claude-plugin/plugin.json is an
  # ADDED file in the diff) must carry the tiered docs the matrix in
  # templates/skill-docs/README.md requires: micro → docs/PRD.md; standard →
  # + docs/ADR.md; pack (2+ skills) → + docs/ONE-PAGER.md. External mirror
  # plugins (dir contains .source.json) are exempt — their docs live upstream.
  # Runs on every PR (no path filter); a PR adding no new plugin is a designed
  # clean pass INSIDE the script (exit 0 + log line), so this job always reports
  # and the ci-required aggregate never sees an undesigned skip.
  check-submission-docs:
    runs-on: ubuntu-latest
    name: check-submission-docs (intake gate)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run gate test corpus
        run: node --test scripts/check-submission-docs.test.mjs

      - name: Check new plugins carry their tier's submission documents
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/check-submission-docs.mjs --changed-only --base "origin/$BASE_REF"

  # Conventional-commit gate. This repo squash-merges, so the PR TITLE is the
  # commit subject that lands on main. The husky commit-msg hook enforces the
  # convention locally per commit, but a web-UI commit or `git commit
  # --no-verify` bypasses it — this job closes that gap by validating the merge
  # artifact (the title) against .github/.commit-rules.json (allowedTypes +
  # allowedScopes = the maintainer AREAS in GOVERNANCE.md). Modeled on
  # CloudWeGo/eino's github-script title validator. On non-PR events (push to
  # main) there is no title to lint, so the script logs and passes — the job
  # still REPORTS success, so the ci-required aggregate never sees a skip.
  commit-scope-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate PR title (conventional-commit + area scope)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rules = JSON.parse(
              fs.readFileSync('.github/.commit-rules.json', 'utf8'),
            );

            if (context.eventName !== 'pull_request') {
              core.info('Not a pull_request event — no PR title to lint. Passing.');
              return;
            }

            const title = (context.payload.pull_request?.title ?? '').trim();
            core.info(`PR title: ${title}`);

            // type(scope)!: subject   — scope and ! optional. A literal ": "
            // (colon-space, per Conventional Commits 1.0.0) and a no-newline
            // subject so a malformed multi-line title can't sneak a payload past
            // the check via `\s` matching a newline.
            const m = title.match(
              /^(?<type>[a-z]+)(?:\((?<scope>[^)]+)\))?(?:!)?: (?<subject>[^\r\n]+)$/,
            );
            if (!m) {
              core.setFailed(
                `PR title is not a Conventional Commit.\n` +
                  `Expected: type(scope): subject   e.g. "feat(marketplace-site): add cowork grid"\n` +
                  `Allowed types: ${rules.allowedTypes.join(', ')}\n` +
                  `Scope is optional; see ${rules.docsUrl}`,
              );
              return;
            }

            const { type, scope, subject } = m.groups;

            if (!rules.allowedTypes.includes(type)) {
              core.setFailed(
                `Commit type "${type}" is not allowed.\n` +
                  `Allowed: ${rules.allowedTypes.join(', ')}`,
              );
              return;
            }

            if (scope) {
              const patterns = (rules.allowedScopePatterns ?? []).map(
                (p) => new RegExp(p),
              );
              const ok =
                rules.allowedScopes.includes(scope) ||
                patterns.some((re) => re.test(scope));
              if (!ok) {
                core.setFailed(
                  `Commit scope "${scope}" is not a known area.\n` +
                    `Use a registered scope, drop the scope, or add it to ` +
                    `.github/.commit-rules.json in this PR (it is the self-` +
                    `documenting area registry — see GOVERNANCE.md § Areas).\n` +
                    `Registered scopes: ${rules.allowedScopes.join(', ')}`,
                );
                return;
              }
            } else if (rules.scopeOptional === false) {
              core.setFailed('A commit scope is required by .commit-rules.json.');
              return;
            }

            const min = rules.subjectMinLength ?? 1;
            if (subject.trim().length < min) {
              core.setFailed(
                `PR title subject is too short (min ${min} chars): "${subject}"`,
              );
              return;
            }

            core.info('✅ PR title passes the conventional-commit + area-scope gate.');

  # Drift gate for the auto-generated per-plugin owner block in
  # .github/CODEOWNERS. Same regenerate-and-diff pattern as sync-marketplace:
  # if a plugin's `maintainer` field changed but CODEOWNERS was not regenerated,
  # this fails and names the fix. Always reports (no path filter).
  codeowners-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Verify CODEOWNERS per-plugin block is in sync
        run: node scripts/generate-codeowners.mjs --check

  # E1.8 deterministic projection gate. This job is unconditional, receives no
  # secrets, and regenerates into memory before byte-comparing with the Git
  # index. Network snapshots and editorial data are deliberately outside this
  # cohort. Keep it in ci-required.needs; do not create a fourth status context.
  generated-content-drift:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The exact historical source is fetched from the reviewed registry
          # below, so this checkout can stay shallow without relying on the
          # source commit remaining an immediate parent.
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch pinned README presentation source
        shell: bash
        run: >-
          set -euo pipefail;
          source_commit="$(node -e "const r=require('./marketplace/ops/readme-presentation-routes.json'); process.stdout.write(r.audit.source_commit)")";
          readonly source_commit;
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]];
          git fetch --no-tags --depth=1 origin "$source_commit"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check deterministic marketplace projections
        run: |
          node --test scripts/generated-content-ci.test.mjs marketplace/scripts/discover-skills.test.mjs marketplace/scripts/md-to-html.test.mjs marketplace/scripts/truncate-html.test.mjs marketplace/scripts/sync-catalog.test.mjs marketplace/scripts/generate-unified-search.test.mjs
          node marketplace/scripts/discover-skills.mjs --level=full --check
          node marketplace/scripts/sync-catalog.mjs --check
          node marketplace/scripts/generate-unified-search.mjs --check

  doc-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The frozen-body check compares against an immutable event baseline.
      # PRs use the exact target base SHA; pushes use the exact prior main SHA.
      # A manual run falls back to its own SHA and therefore remains a no-op
      # for historical drift while still validating all current content.
      - name: Fetch document-class baseline
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASELINE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install root measurement dependencies
        run: pnpm install --frozen-lockfile --filter "claude-code-plugins-monorepo"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install pyyaml

      # 000-docs ignore-policy invariant (ownership + filing-ledger model —
      # 000-docs/.gitignore header; Mission 01 bead claude-5awj.6) plus the
      # citation gate: no governance-scope file may cite an untracked doc.
      - name: Check 000-docs ignore policy fixtures
        run: node scripts/check-docs-ignore-policy.mjs

      - name: Check doc citations resolve to tracked files
        run: node scripts/check-doc-citations.mjs

      # A document cannot grant itself authority by editing its own header.
      # STANDARDS.md § Canonical documents is the sole public authority index.
      - name: Check document authority claims have canonical pointers
        run: |
          node --test scripts/check-doc-authority.test.mjs
          node scripts/check-doc-authority.mjs

      # j-rig owns eval execution but never writes its runtime tables into the
      # Freshie inventory. First-party operator surfaces must use the scratch-DB
      # wrapper and repository-owned recorder described by blueprint 727 §4.
      - name: Check JRig never receives the Freshie inventory database
        run: pnpm run validate:jrig-db-boundary

      # Supersession is one atomic record, not a status-only edit. Keep the
      # frozen header, per-section disposition, and canonical pointer together.
      - name: Check document supersession record template
        run: |
          node --test scripts/check-supersession-template.test.mjs
          node scripts/check-supersession-template.mjs --all

      # Every tracked Markdown document has an explicit lifecycle class. The
      # check also keeps frozen 6767 bodies byte-stable and delegates the
      # generated index content comparison to its canonical writer.
      - name: Check document classes and frozen/generated boundaries
        env:
          DOC_CLASS_BASELINE_REF: FETCH_HEAD
        run: |
          node --test scripts/check-doc-classes.test.mjs
          node scripts/check-doc-classes.mjs

      # The documentation estate index is a generated projection of Git's
      # tracked inventory; hand-edited counts or rows must never drift.
      - name: Check generated documentation index is current
        run: |
          node --test scripts/generate-docs-index.test.mjs
          node scripts/generate-docs-index.mjs --check

      # Blueprint 727 Epic 1 uses one cohort-labelled scorecard for every
      # before/after claim. Recompute it from the exact Git index and reject
      # stale or hand-edited evidence in the same required aggregate context.
      - name: Check Epic 1 measurement scorecard is current
        run: |
          node --test scripts/measure-epic-1.test.mjs scripts/measure-epic-1-scorecard.test.mjs
          pnpm run measure:e1:check

      # The live property is tonsofskills.com. Preserve frozen 6767 records and
      # provenance-owned mirrors byte-for-byte, but refuse the retired domain on
      # every first-party source or generated projection. This remains inside
      # doc-governance, which is a blocking dependency of ci-required, so the
      # policy blocks merges without adding a fourth required status context.
      - name: Reject the retired domain on actionable surfaces
        run: pnpm run validate:dead-domain

      # External stats artifacts (stars, npm downloads, installs) must declare
      # their own max_age_hours freshness bound (blueprint 727 E1.10). PR CI
      # enforces the declaration structurally; age breaches stay advisory here
      # (time-based, unrelated to PR content) and fail hard in the daily
      # update-npm-stats workflow instead. The homepage independently refuses
      # to render an out-of-bound number as current.
      - name: Check external stats artifacts declare freshness bounds
        run: pnpm run validate:stats-freshness

      # The two most rot-prone documented facts stay mechanically equal to the
      # code (blueprint 727 E2.7 + E2.8): CLAUDE.md's enumerated ci-required
      # gate list must equal the workflow's needs: block, CLAUDE.md and
      # GOVERNANCE.md must name all three required contexts, and every live
      # schema-version claim surface must equal the validator's SCHEMA_VERSION.
      - name: Assert documented ci-required contract and schema version equal the code
        run: pnpm run validate:doc-fact-assertions

      # The root README is a governed landing contract (blueprint 727 § 6A):
      # frozen install slug verbatim, no bare integers outside generated
      # blocks, four artifact classes defined, five navigation doors live, no
      # adapterless harness named as supported. R1/R2 (no per-plugin rows,
      # byte budgets) are enforced inside generate-readme-toc.mjs itself.
      - name: Check the README landing contract
        run: pnpm run validate:readme-contract

      # Model-neutral rename compatibility (blueprint 727 E11.10 / decision
      # 803): canonical repository/catalog endpoints coexist with the frozen
      # marketplace slug, npm package, ccpi command, and tons binary alias.
      # Public redirects are checked separately with the script's --live mode;
      # required CI remains deterministic and network-free.
      - name: Check the post-rename identity compatibility contract
        run: pnpm run validate:identity-compatibility

      # The canonical harness-free skill contract (blueprint 727 § 5.2, Epic 3
      # E3.2): schemas/canonical/v0 must compile under Ajv 2020 strict and hold
      # its red runs (closed schema, no vendor-literal model class, registry-
      # enum adapters, resolved-SHA mirror pins). DRAFT + UPSTREAM-PENDING —
      # the kernel proposal is E3.13's deliverable.
      - name: Check the canonical skill-contract schema
        run: pnpm run validate:canonical-schema

      # Capability-vocabulary coverage (blueprint 727 E3.3): every tool token
      # in every tracked SKILL.md/agent allowlist must map to an abstract
      # capability through the ONE shared parser, or carry an enumerated
      # disposition. An unmapped token fails, naming file and token.
      - name: Check capability-vocabulary coverage
        run: pnpm run validate:capability-coverage

      # Model-id classifier protection contract (blueprint 727 E3.7): the
      # committed exclusion list must stay a complete census of live bead
      # handles, and a bead handle must never classify as migratable — even on
      # a model:/--model line. E3.8's rewriter and E3.10's gate import this
      # exact library; the tests are the contract.
      - name: Check model-id classifier protections
        run: pnpm run validate:model-id-classifier

      # Thin-adapter conformance (blueprint 727 E3.5): an adapter subtree may
      # never contain a byte-identical copy of a canonical file (a fork is not
      # an adapter) nor reference/script/eval/license/version content. Waivers
      # are dated and name the bead that deletes them (the known Kobiton
      # .codex fork, removed by E3.6).
      - name: Check adapter thinness
        run: pnpm run validate:adapter-thinness

      # The generated-adapter toolchain (blueprint 727 E3.4/E3.8/E3.9): the
      # compatibility projection is deterministic and marker-prefixed; the
      # claude-code adapter resolves model_class tiers and portable runtime
      # variables FAIL-CLOSED — an unresolvable tier or unknown variable
      # throws, never silently substitutes.
      - name: Check the generated-adapter toolchain
        run: pnpm run validate:adapter-toolchain

      # Canonical vendor-literal gate (blueprint 727 E3.10): a Claude-specific
      # token reappearing in the harness-free core (skill-card.yaml files or
      # canonical/ dirs) fails — model literals, ${CLAUDE_*}, mcp__ spellings,
      # Builtin(...) scoping, denylist fields. Adapters and the v0 contract
      # docs are the translation layer and are exempt by design.
      - name: Check canonical layer for vendor literals
        run: pnpm run validate:canonical-vendor-literals

      # Unbacked-portability ratchet (blueprint 727 E3.11): a first-party
      # SKILL.md may not name a harness outside the registered adapter set
      # (claude-code) in its compatibility claim, in any phrasing. Withdrawn
      # 2,700 legacy claims stay withdrawn; mirror-owned claims are reported,
      # never failed (upstream-repair only).
      - name: Check portability claims are adapter-backed
        run: pnpm run validate:portability-claims

      # 6767-h is a frozen historical standard that remains cited by schemas.
      # Pin its section map and prove every cited heading still resolves.
      - name: Check frozen prose anchors remain valid
        run: python3 -m unittest tests.test_prose_anchors -v

      # Recurrence prevention for the tracked-generated-artifact class: a
      # projection that is also committed has two claimants to one fact and
      # diverges silently (public/data duplicated ~28.5MB of src/data with
      # identical blob SHAs). Beads claude-5awj.2 / .1.
      - name: Check generated projections are not tracked
        run: pnpm run validate:generated-artifacts

  # E4.6 (blueprint 727): blocking, diff-scoped scan for UNVERIFIABLE secrets
  # on every PR. Closes the union gap the Safety Enforcement Register (790 §2)
  # measured: gitleaks is rule-shape-based and trufflehog's weekly job runs
  # --only-verified on a schedule — so a rotated key or internal token whose
  # issuer can't be probed never gated a PR. This job runs trufflehog over the
  # PR range WITHOUT --only-verified (verified + unknown results both fail).
  # Diff-scoped noise measured before landing: 0 findings across the prior 30
  # commits — detector-shape matching doesn't fire on the repo's teaching
  # placeholders the way generic-entropy rules would.
  # The scan step skips outside pull_request (designed if:, same pattern as
  # scan-synced-content) so the job always reports for the aggregate.
  secret-diff-scan:
    runs-on: ubuntu-latest
    name: secret-diff-scan (unverified, PR diff)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan the PR range for unverifiable secrets
        if: github.event_name == 'pull_request'
        # Same SHA pin as secret-scan.yml's weekly job — never @main; the
        # action appends --fail itself (do not repeat it in extra_args).
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

  # ───────────────────────────────────────────────────────────────────────────
  # Aggregate required gate. This is the SINGLE pull_request status context in
  # branch protection (alongside `gitleaks`). Because this workflow runs on
  # EVERY pull_request (no path filter — see `on:` above), this job always
  # reports, which is what fixes the "N Expected forever" stuck-PR class where a
  # path-filtered required check never runs and the PR can never merge (#778).
  #
  # It fails if ANY needed job ended in `failure` or `cancelled`. A `skipped`
  # result counts as PASS — but that is ONLY legitimate for a job that skipped
  # via a DESIGNED job-level `if:` (a conditional gate that correctly did not
  # apply). Do not add a job to `needs:` that can skip for an undesigned reason,
  # or a real gate could be silently bypassed by a green aggregate.
  # ───────────────────────────────────────────────────────────────────────────
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - marketplace-compliance-ratchet
      - verify
      - test
      - check-package-manager
      - marketplace-validation
      - cli-smoke-tests
      - shellcheck-skills
      - skill-codeblock-syntax
      - typescript-coverage-audit
      - eslint-check
      - format-check
      - ruff-check
      - ruff-format-check
      - markdownlint
      - scan-synced-content
      - promote-curated-check
      - check-submission-docs
      - commit-scope-check
      - codeowners-drift
      - generated-content-drift
      - doc-governance
      - secret-diff-scan
    steps:
      - name: Assert every gated job passed (skipped == a designed conditional gate)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON"
          bad=$(printf '%s' "$NEEDS_JSON" \
            | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::ci-required: these gated jobs did not pass: $bad"
            exit 1
          fi
          echo "✅ ci-required — every gated job passed (or was designed-skipped)."

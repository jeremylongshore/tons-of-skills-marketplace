name: Validate Plugins

on:
  workflow_dispatch:
  # Runs on every PR. The jobs below are listed in branch-protection's
  # required-status set; if a path filter here skips the run, those required
  # checks stay "Expected" forever and the PR cannot merge (the "10 Expected
  # forever" stuck-PR class — observed on PR #778). Trade-off: 5-10 extra
  # Actions minutes per PR that doesn't touch validator-relevant files.
  pull_request:
  push:
    branches: [main]

# Supersede stale PR runs (this aggregate re-runs on every push with no path
# filter), but NEVER cancel a main run — a cancelled required job reads as a
# gate failure. Per the 2026-07-14 ops review (bead claude-k0h2).
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # fetch-depth=2 + persist-credentials=true required for the
        # "Catalog format guard" step below — it runs `git fetch origin
        # <base_ref>` to compare against the PR's merge base. Without
        # credentials persisted, that fetch errors with "could not read
        # Username for github.com". Default actions/checkout@v6 behavior
        # depth=1 doesn't include any history to compare against either.
        with:
          fetch-depth: 2
          # fetch-tags is REQUIRED by check-changelog-coverage.mjs below.
          # actions/checkout does not fetch tags by default, so `git tag --list`
          # returned EMPTY and that gate silently exited 0 — it never fired in
          # CI at all. Verified by cloning --depth 2 --no-tags and deleting every
          # release note: still exit 0. fetch-depth stays 2 (the catalog format
          # guard needs the merge base); fetch-tags is the surgical addition.
          fetch-tags: true
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install root dev dependencies
        run: pnpm install --frozen-lockfile --filter "claude-code-plugins-monorepo"

      # Supply-chain parity gate (blueprint 727 E1.12): every source registered
      # in sources.yaml must have a reviewed sources.lock.json baseline, and no
      # lock entry may outlive its registration. A registered-but-unlocked
      # source syncs unpinned (the uizze gap); an orphaned lock entry is a
      # stale approval. Full-repo and deterministic — runs on every event.
      - name: Assert sources.yaml and sources.lock.json key parity
        run: pnpm run validate:sources-lock-parity

      # Blueprint 727 E7.14 / P2: every configured mirror must explicitly
      # select license text and every checked-in mirrored artifact must carry it
      # at its root. This is a hard gate, not a sync-time warning.
      - name: Enforce mirror license coverage
        run: pnpm run validate:mirror-licenses

      # Blueprint 727 E7.5: package display versions must agree across the
      # plugin manifest, editable marketplace catalog, and skill frontmatter.
      # This is deliberately inside the existing validate job so it blocks
      # ci-required without adding another required status context.
      - name: Enforce version-surface agreement
        run: node scripts/reconstruct-versions.mjs --check

      # Credential pre-flight (blueprint 727 E1.14 / § 18.7): the root
      # .mcp.json must never hold a live-shaped credential in plaintext env —
      # values are SOPS-encrypted in the untracked machine-local .env.sops and
      # injected at MCP launch by scripts/sops-env. CI checkouts have no root
      # .mcp.json (untracked), so this passes trivially here; the same command
      # is the local pre-flight, and the unit tests pin the classifier.
      - name: Refuse plaintext credentials in the root MCP config
        run: pnpm run validate:mcp-plaintext-creds

      # E4.5 allowlist-shape ratchet: the gitleaks allowlist may never regain
      # a file-TYPE blanket (SKILL.md/README/CHANGELOG/references/tests/
      # fixtures/000-docs), and every path exception must carry a written
      # reason + expiry. Placeholder examples pass by VALUE, keeping the file
      # itself scanned.
      - name: Enforce the gitleaks allowlist shape
        run: pnpm run validate:gitleaks-config

      # E4.10: every tracked MCP plugin must declare its destructive-operation
      # policy (plugins/mcp/destructive-policies.json); refuse/recommend-only
      # declarations are executed against their named refusal test — a
      # declaration is only as good as its passing test.
      - name: Enforce MCP destructive-operation policies
        run: pnpm run validate:mcp-destructive-policy

      # E4.3/E4.4/E4.11: the triple-keyed safety ratchet. Frozen debt classes
      # (bare-Bash skills, tier-2 tool-safety findings, YAML shell-substitution
      # occurrences — never waivable — and the agents-lane error corpus) are
      # monotone non-increasing; a swap fails even at equal count; a shrink
      # re-pins via --write in the shrinking PR. Metrics come from the
      # canonical validator (--safety-metrics / --agents-only) so this gate
      # owns no classification logic.
      - name: Setup Python for the safety ratchet
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce the safety ratchet
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          pnpm run validate:safety-ratchet

      # Blueprint 727 E8.8: missing-required-frontmatter remediation stops at
      # a .source.json boundary. The canonical validator reports editable
      # first-party and upstream mirror records separately; first-party debt is
      # pinned at zero with count + set-hash + members, while every mirror row
      # must remain QUARANTINE in the disposition ledger. No waiver path exists.
      - name: Enforce the structural remediation ratchet
        run: pnpm run validate:structural-ratchet

      # Blueprint 727 E8.1: Freshie's graded cohort is the authority for the
      # disposition ledger. Regenerate-and-compare proves each current graded
      # artifact has exactly one first-match-wins outcome; missing/stale rows
      # fail closed instead of silently changing publication eligibility.
      - name: Verify the generated legacy disposition ledger
        run: pnpm run validate:disposition-ledger

      # Bead claude-juoz.3.11: repeated family names establish a review
      # denominator only. Regenerate-and-compare prevents local/untracked files
      # or stale catalog counts from changing the pack-by-pack queue silently.
      - name: Verify the SaaS tutorial-lattice denominator
        run: pnpm run validate:saas-lattice

      - name: Keep quarantined external mirrors off publishable grade surfaces
        run: pnpm run validate:mirror-quarantine

      # E4.13: a denylist (disallowed-tools) posture is enforced by the
      # Claude Code runtime only. This gate forbids silent-drop: a
      # denylist-bearing skill may not claim a foreign harness in
      # compatibility, and a skill-card adapter beyond claude-code must
      # degrade the denylist fail-closed (structural until card adoption).
      - name: Enforce fail-closed denylist degradation
        run: pnpm run validate:denylist-degradation

      # Supply-chain intake gate: sources.yaml include-anchoring ratchet.
      # An include starting with neither '/' nor '**' is silently auto-prefixed
      # '**/' by the sync engine's matcher and matches at ANY depth — the
      # over-collection class behind the 2026-07-13 tailnet-IP leak (an
      # unanchored 'README.md' admitted upstream's onboarding/README.md into
      # the public mirror). The engine's sync-time warning is advisory only;
      # THIS is the hard gate: any source ADDED (or whose include list is
      # EDITED) in this PR must be fully anchored. Untouched legacy entries are
      # grandfathered until touched (54 predate the rule — the ratchet scope is
      # what keeps the gate green today without weakening it for new intake).
      # Diff-scoped, so pull_request only — a DESIGNED skip on push (no base).
      # Blocks through the ci-required aggregate via this `validate` job.
      - name: Lint sources.yaml include anchoring (intake ratchet)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/sync-lint-ignores.mjs --check-source-anchoring --base="origin/${{ github.base_ref }}"

      # @intentsolutions/audit-harness verify — exit 0 when policy hashes
      # match `.harness-hash`, exit 2 when a hash-pinned file was changed
      # without a paired engineer-initiated `pnpm exec audit-harness init`.
      # Pin surface (IEP #18 / 1jn0.2.1): plugins/**/eval-spec.yaml,
      # skills/.curated/**/eval-spec.yaml, and .harness-hash-extra-patterns.
      # Re-pin ritual: edit an eval-spec → `pnpm exec audit-harness init` →
      # commit both in the same PR.
      - name: Verify audit-harness integrity
        run: pnpm exec audit-harness verify

      # CI deadline enforcement — fails the build if any
      # `# REPORT-ONLY-UNTIL: YYYY-MM-DD` marker in any workflow file is
      # past its date. Forcing function: report-only gates can't rot
      # silently into permanent test bypasses.
      - name: Enforce CI deadlines (no report-only rot)
        run: python3 scripts/check-ci-deadlines.py

      # Agent-frontmatter validation — surfaces agent.md schema findings on every
      # PR (previously ungated). REPORT-ONLY for now: the agent corpus is
      # unbaselined (currently has pre-existing errors), so this reports without
      # walling merges; flip to a blocking gate once the corpus is curated.
      # REPORT-ONLY-UNTIL: 2026-10-31 (agent corpus unbaselined; flip to blocking once curated)
      - name: Validate agent frontmatter (report-only)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml || true
          python3 scripts/validate-skills-schema.py --agents-only || true

      # .mcp.json validation, two lanes (E4.8, blueprint 727):
      #   1. UNAMBIGUOUS classes block: JSON parse failures, non-object server
      #      maps/entries, and a server missing its transport-essential field
      #      (stdio ⇒ command; http/sse ⇒ url). Landed with zero baseline debt.
      #   2. Everything else (the IS overlay: description/version/enabled/…)
      #      stays advisory under the deadline below; full --strict promotion
      #      remains the DR-049 soak checklist's call — never pass --strict here.
      # REPORT-ONLY-UNTIL: 2026-11-17
      - name: Validate .mcp.json configs (advisory + unambiguous gate)
        run: |
          node scripts/validate-mcp-config.mjs || true
          node scripts/validate-mcp-config.mjs --gate-unambiguous

      # Design-tell gate (VibeCheck 25/100 regression guard, 2026-05-31).
      # Fails on chrome gradients, glassmorphism, purple/indigo/violet
      # utilities, or em-dash density >12 in visible chrome.
      # See marketplace/DESIGN.md § 8 + Changelog 2026-05-31.
      - name: Lint design tells (VibeCheck gate)
        run: pnpm run lint:design

      - name: Sync CLI marketplace catalog
        run: |
          node scripts/sync-marketplace.cjs
          if ! git diff --quiet .claude-plugin/marketplace.json; then
            echo "Marketplace CLI catalog was out of date. Run: node scripts/sync-marketplace.cjs"
            git diff --stat
            exit 1
          fi

      - name: Validate catalog invariants (FS path = category)
        run: python3 scripts/validate-catalog-invariants.py

      # Public HTML reaches set:html sinks, so the response policy is a
      # required defense-in-depth surface. The test pins the exact Astro
      # preview/Caddy projection and plants missing/weak directives; this job
      # is already an input to ci-required.
      - name: Enforce marketplace response-security policy
        run: pnpm run validate:security-headers

      # Unicode-hygiene gate. Detects the supply-chain attack class
      # schema validation cannot see: invisible tag characters
      # (U+E0000-U+E007F, the Socket TrapDoor vector, advisory 2026-05-24),
      # bidi overrides (Trojan Source, CVE-2021-42574), zero-width / format
      # chars in instructional text, and mixed-script identifiers in install
      # commands. Default mode blocks on BLOCKER only; --strict would also
      # block on MAJOR (deferred until the one known legit-ZWS workaround in
      # plugins/community/contributing-clanker is cleaned up separately).
      - name: Validate Unicode hygiene (Trapdoor / Trojan Source defense)
        run: python3 scripts/validate-unicode-hygiene.py

      - name: Test Unicode hygiene validator (fixture regression)
        run: python3 -m unittest tests.test_validate_unicode_hygiene -v

      # Deterministic coverage for the dolt-mcp-vcs mutation chokepoint (the
      # verb-class SQL classifier that decides whether an agent's SQL may rewrite
      # Dolt history) and the Freshie Dolt exporter's dialect translation. Both
      # are security/data-critical, stdlib-only, and were previously runnable but
      # ungated. safety-eval.yaml cites tests/test_sql_classifier.py as this gate.
      - name: Test in-repo Python suites (validators, exporters, skill scripts)
        run: |
          python3 -m pip install --quiet -r freshie/requirements-doltlite.txt
          python3 -c "import doltlite; assert doltlite.__version__ == '0.50.1'"
          python3 -m unittest tests.test_sql_classifier -v
          python3 -m unittest tests.test_dolt_sync -v
          python3 -m unittest tests.test_doltlite_sync -v
          python3 -m unittest tests.test_promote_curated_workflow -v
          python3 -m unittest tests.test_run_delta -v
          python3 -m unittest tests.test_batch_remediate_compat -v
          python3 -m unittest tests.test_hms_readiness_classifier -v
          python3 -m unittest tests.test_enable_system_schemas -v
          python3 -m unittest tests.test_cluster_forensics -v
          python3 -m unittest tests.test_marketplace_compliance_baseline -v
          python3 -m unittest tests.test_marketplace_compliance_ratchet -v
          python3 -m unittest tests.test_sync_marketplace_root_resolution -v

      # Reject PRs that reformat .claude-plugin/marketplace.extended.json beyond
      # the line budget implied by added/modified entries. Prevents prettier or
      # IDE format-on-save passes from rewriting the whole catalog and wrecking
      # merge bases for every other in-flight PR. Pulls origin/main for the
      # comparison; safe-skips on push to main (no useful base).
      - name: Catalog format guard (no whole-file reformat)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/check-catalog-format.py "origin/${{ github.base_ref }}"

      - name: Verify README TOC is in sync with catalog
        run: node scripts/generate-readme-toc.mjs --check

      - name: Verify README Killer-Skill block is in sync with spotlights.json
        run: node scripts/render-spotlight.mjs --check

      # Epic 1.6: a public skill total is valid only when its cohort and exact
      # corpus-resolver command travel with it. Keep this inside the existing
      # validate job so the gate adds no fourth required status context.
      - name: Validate published count cohort labels
        run: pnpm run validate:published-count-cohorts

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          # Exclude:
          #  - tsconfig*.json (JSONC — JSON with Comments)
          #  - node_modules/**/strictest.json and similar JSONC files shipped
          #    by Astro and other transitive deps. The validate job now installs
          #    root dev dependencies (for audit-harness verify + lint:root), so
          #    node_modules/ exists at scan time and must be excluded.
          find . \
            -name "*.json" \
            -not -name "tsconfig*.json" \
            -not -path "./node_modules/*" \
            -not -path "*/node_modules/*" \
            -type f -exec sh -c '
            for file; do
              echo "Checking $file"
              if ! jq empty "$file" 2>/dev/null; then
                echo "Invalid JSON: $file"
                exit 1
              fi
            done
          ' sh {} +

      - name: Validate design-token discipline (DESIGN.md color rules)
        run: node scripts/lint-design-tokens.mjs

      # Deliberately a step in `validate` (already in ci-required's needs) rather
      # than a new job: it needs no wiring change to become blocking, and it must
      # NOT be confused with check-links.yml, which is path-filtered and reports
      # `fail: false`. Only the DETERMINISTIC half (links to paths inside the repo)
      # is gated here; external link rot stays with the weekly lychee report,
      # where a rate-limit false positive costs a glance, not a blocked merge.
      - name: Validate internal doc links resolve (deterministic half of link-check)
        run: node scripts/check-internal-doc-links.mjs

      # Same placement rationale as the doc-links step above: a step in `validate`,
      # which is already in ci-required's needs, so it is blocking with no change
      # to branch protection. Scans untracked files too, so a scratch note that
      # never gets committed still trips it locally before it can reach a diff.
      - name: Validate design-reference anonymity (name-leak gate)
        run: bash scripts/name-leak-gate.sh

      # BaseLayout emits og:image -> /og-image.png on every page. That file had
      # NEVER been committed, so 3,830 built pages advertised an image that
      # returned 404 and every link preview of the site rendered blank — for the
      # life of the site, with nothing failing to signal it. This asserts the
      # file exists; regenerate with `node scripts/generate-og-image.mjs`.
      - name: Validate social-card image exists (og:image)
        run: node scripts/generate-og-image.mjs --check

      # /changelog had 3 entries (newest v4.16.0, 2026-03-07) while the site ran
      # v4.33.0 — 17 tagged releases shipped undocumented and nothing failed,
      # while the homepage linked "what's new →" straight at it. Ratchets from a
      # pinned floor (v4.14.0); older tags are grandfathered.
      - name: Validate every released tag has release notes
        run: pnpm run validate:changelog-coverage

      - name: Validate cascading Greptile configuration
        run: |
          node --test scripts/validate-greptile-config.test.mjs
          pnpm run validate:greptile

      - name: Check plugin structure
        run: |
          echo "Checking plugin structure..."
          # Find all plugin directories (any directory with .claude-plugin/plugin.json)
          # -maxdepth 4 = plugins/<category>/<plugin>/.claude-plugin/plugin.json only.
          # This excludes nested sub-plugin manifests inside synced plugins like
          # tonone, where each skill subdirectory has its own plugin.json from
          # upstream. Those aren't separate marketplace plugins.
          find plugins/ -maxdepth 4 -name "plugin.json" -path "*/.claude-plugin/plugin.json" | while read -r plugin_json; do
            plugin=$(dirname "$(dirname "$plugin_json")")
            echo "Validating $plugin"

            # Check for README
            if [ ! -f "$plugin/README.md" ]; then
              echo "Missing README.md in $plugin"
              exit 1
            fi

            # Check scripts are executable — SKIPPED for external mirror
            # plugins (dir carries a .source.json marker). The sync engine
            # preserves upstream file modes (mirror fidelity), and a sourced
            # .sh library is CORRECTLY non-executable upstream (2026-07-13:
            # skills-janitor scripts/paths.sh at 0644 red-failed this gate and
            # forced a local chmod that diverged the mirror from its source of
            # truth). Mirror fidelity wins for mirrors; in-repo plugins keep
            # the strict exec-bit requirement unchanged.
            if [ -f "$plugin/.source.json" ]; then
              echo "  ↳ external mirror (.source.json) — upstream file modes are authoritative; skipping exec-bit check"
            elif [ -d "$plugin/scripts" ]; then
              find "$plugin/scripts" -type f -name "*.sh" | while read -r script; do
                if [ ! -x "$script" ]; then
                  echo "Script not executable: $script"
                  exit 1
                fi
              done
            fi
          done

      # Every package-bearing external mirror is non-publishable. Provenance
      # comes only from .source.json; this prevents a mirror from entering a
      # future publish candidate list through a naming or path convention.
      - name: Enforce private external mirror packages
        run: |
          node --test scripts/check-mirror-packages-private.test.mjs
          node scripts/check-mirror-packages-private.mjs

      # E7.2: package privacy is one boundary; publisher-level provenance
      # exclusion is the independent second boundary. This stays inside the
      # existing validate job so ci-required gains no fourth status context.
      - name: Refuse provenance-marked publish candidates
        run: |
          node --test scripts/plugin-provenance.test.mjs
          node scripts/publish-candidate-report.mjs --all --scope '@intentsolutionsio/' --json > /tmp/e72-publish-report.json
          jq -e '.refused | length == 0' /tmp/e72-publish-report.json
          jq -e '[.firstPartyCandidates[] | select(.reasonCode != "FIRST_PARTY_CANDIDATE")] | length == 0' /tmp/e72-publish-report.json
          echo "E7.2 dry-run: $(jq '.firstPartyCandidates | length' /tmp/e72-publish-report.json) first-party candidates; $(jq '.mirrorSkipped | length' /tmp/e72-publish-report.json) provenance candidates skipped; 0 refused candidates."

      # E7.3: deterministic fixture coverage for the workflow_run guard and
      # exact-SHA required-check preflight. This remains a step in validate,
      # so ci-required gains no fourth status context.
      - name: Test npm publication locks
        run: node --test scripts/npm-publication-lock.test.mjs

      # E7.9: any workflow that can mint OIDC credentials, publish to npm, or
      # sign evidence must pin every external action to an immutable commit.
      - name: Enforce privileged action SHA pins
        run: pnpm run validate:privileged-action-pins

      - name: Pin the required skill-conform harness exactly
        run: node --test scripts/check-audit-harness-pin.test.mjs

      - name: Validate marketplace catalog
        run: |
          echo "Validating marketplace catalog..."
          jq empty .claude-plugin/marketplace.json

          # Check all plugin sources exist
          jq -r '.plugins[].source' .claude-plugin/marketplace.json | while read -r source; do
            if [[ "$source" == ./* ]]; then
              if [ ! -d "$source" ]; then
                echo "Plugin source not found: $source"
                exit 1
              fi
            fi
          done

      - name: Security scan - Informational sweep (non-blocking)
        # Authoritative secret scanning runs in secret-scan.yml via gitleaks
        # (every PR/push) and trufflehog (weekly verified). This step is a
        # cheap heuristic that surfaces common placeholder-shaped patterns
        # for reviewer attention. Never blocks CI — gitleaks owns blocking.
        run: |
          echo "Scanning for credential-shaped strings (informational)..."
          # shellcheck disable=SC2016  # the grep -v '\$(' pattern is a literal regex, not an expansion
          MATCHES=$(grep -r -E "(password|secret|api_key|token)(\s*)=(\s*)['\"]" plugins/ 2>/dev/null | \
            grep -v '= "\*\*\*"' | \
            grep -v "= '\*\*\*'" | \
            grep -v '= "xxx"' | \
            grep -v '= "XXX"' | \
            grep -v 'placeholder' | \
            grep -v 'PLACEHOLDER' | \
            grep -v 'example' | \
            grep -v 'EXAMPLE' | \
            grep -v 'your-' | \
            grep -v 'YOUR_' | \
            grep -v 'test-' | \
            grep -v 'openssl rand' | \
            grep -v 'pwgen' | \
            grep -v 'random.choice' | \
            grep -v 'secrets.choice' | \
            grep -v '\$(' | \
            grep -E "['\"][^'\"]{20,}" || true)

          if [ -n "$MATCHES" ]; then
            echo "::notice::Informational — credential-shaped strings detected. Review below and confirm gitleaks is clean."
            echo "$MATCHES"
          else
            echo "✅ No credential-shaped strings detected"
          fi

      - name: Security scan - Dangerous patterns
        run: |
          echo "Scanning for dangerous command patterns..."
          FOUND_ISSUES=0

          # Check for destructive commands (only root deletion, not /var/... paths)
          # Match: rm -rf / or rm -rf /* but NOT rm -rf /var/... etc.
          DANGEROUS_RM=$(grep -r -E "rm\s+-rf\s+/(\s|$|\*)" plugins/ 2>/dev/null | grep -v "/var/" | grep -v "/tmp/" | grep -v "/prometheus/" || true)
          if [ -n "$DANGEROUS_RM" ]; then
            echo "❌ ERROR: Dangerous 'rm -rf /' pattern detected!"
            echo "$DANGEROUS_RM"
            FOUND_ISSUES=1
          fi

          # Check for command injection risks (exclude README documentation)
          EVAL_USES=$(grep -r -E "eval\s*\(" plugins/ 2>/dev/null | grep -v "README.md" | grep -v "this.redis.eval" || true)
          if [ -n "$EVAL_USES" ]; then
            echo "⚠️  WARNING: 'eval()' detected - potential command injection risk"
            echo "$EVAL_USES"
          fi

          # Check for suspicious curl/wget to unknown domains
          if grep -r -E "curl.*http://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+" plugins/ 2>/dev/null; then
            echo "⚠️  WARNING: curl to IP address detected - potential data exfiltration"
          fi

          # Check for base64 encoded content (potential obfuscation)
          if grep -r -E "base64\s+-d" plugins/ 2>/dev/null; then
            echo "⚠️  WARNING: base64 decoding detected - potential obfuscation"
          fi

          if [ $FOUND_ISSUES -eq 0 ]; then
            echo "✅ No dangerous patterns detected"
          else
            exit 1
          fi

      - name: Security scan - Suspicious URLs
        run: |
          echo "Scanning for suspicious URLs..."
          # Check for non-HTTPS URLs (except localhost)
          if grep -r -E "http://[^l]" plugins/ | grep -v "localhost" | grep -v "127.0.0.1" 2>/dev/null; then
            echo "⚠️  WARNING: Non-HTTPS URLs detected (security risk)"
          fi

          # Check for URL shorteners (potential phishing)
          if grep -r -E "(bit\.ly|tinyurl\.com|goo\.gl)" plugins/ 2>/dev/null; then
            echo "⚠️  WARNING: URL shorteners detected (potential phishing)"
          fi

          echo "✅ URL scan complete"

      - name: Security scan - MCP plugin dependencies
        if: hashFiles('plugins/mcp/*/package.json') != ''
        run: |
          echo "Scanning MCP plugin dependencies..."
          for package in plugins/mcp/*/package.json; do
            if [ -f "$package" ]; then
              echo "Checking $package"
              dir=$(dirname "$package")
              cd "$dir"

              # npm-audit policy — REPORT-ONLY (loud, not blocking) until the
              # date below. Decision: a hard block on high/critical would
              # red-wall every PR whenever an unrelated upstream advisory drops
              # (this repo vendors ~450 plugins, each with its own deps) — i.e.
              # fail on state the PR never touched. The prior `npm audit
              # --production || true` was the opposite failure: silent, so a
              # real high/critical advisory produced no signal at all. This is
              # the honest middle — audit at --audit-level=high and SURFACE
              # findings as a CI ::warning:: annotation, without failing.
              #
              # REPORT-ONLY-UNTIL: 2026-09-30 (npm-audit policy revisit; #927)
              # When this lapses, check-ci-deadlines.py fails the build — revisit
              # whether to flip to blocking (e.g. scoped to the changed plugin's
              # deps only) or extend with a documented reason.
              if command -v npm &> /dev/null; then
                if ! npm audit --production --audit-level=high; then
                  echo "::warning file=$dir/package.json::npm audit found high/critical advisories in $dir — report-only until 2026-09-30 (npm-audit policy, #927)"
                fi
              fi

              cd -
            fi
          done
          echo "✅ Dependency scan complete"

  # Blueprint 727 E6.4/E6.7: R1 plus the post-observation R2/R4 monotone metric
  # checks need an independently visible, always-reporting blocking job.  It
  # is listed in ci-required below rather than folded into `validate`, so a
  # pre-existing failure in an unrelated validation lane cannot obscure the
  # compliance-ratchet result.  The validator emits the complete
  # skills/commands/agents/manifests corpus; observed runtime is about 70
  # seconds, bounded here at two minutes.
  marketplace-compliance-ratchet:
    name: marketplace-compliance-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # E6.6 compares the PR range to origin/main. The default one-commit
          # checkout makes Git treat both refs as shallow roots, so the
          # fail-closed range check cannot find their merge base.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse unauthorized marketplace baseline policy-envelope changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          args=(
            --check-growth-only
            --base "origin/$BASE_REF"
            --head-ref "$HEAD_REF"
          )
          if [[ "$HEAD_REF" =~ ^automation/compliance-baseline-([1-9][0-9]*)$ ]]; then
            run_id="${BASH_REMATCH[1]}"
            evidence_dir="$(mktemp -d)"
            trap 'rm -rf -- "$evidence_dir"' EXIT
            gh api "repos/$REPOSITORY/actions/runs/$run_id" > "$evidence_dir/run.json"
            gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=latest" > "$evidence_dir/jobs.json"
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=all \
              -f "head=$REPOSITORY_OWNER:$HEAD_REF" \
              -f per_page=100 > "$evidence_dir/pulls.json"
            mkdir "$evidence_dir/artifact"
            gh run download "$run_id" \
              --repo "$REPOSITORY" \
              --name "marketplace-compliance-baseline-$run_id" \
              --dir "$evidence_dir/artifact"
            mapfile -d '' artifact_files < <(find "$evidence_dir/artifact" -type f -print0)
            test "${#artifact_files[@]}" -eq 1
            args+=(
              --head-sha "$HEAD_SHA"
              --repository "$REPOSITORY"
              --repository-owner "$REPOSITORY_OWNER"
              --base-ref "$BASE_REF"
              --pr-number "$PR_NUMBER"
              --capture-run-metadata "$evidence_dir/run.json"
              --capture-run-jobs "$evidence_dir/jobs.json"
              --capture-pull-requests "$evidence_dir/pulls.json"
              --capture-artifact "${artifact_files[0]}"
            )
          fi
          python3 scripts/check-marketplace-compliance-baseline.py "${args[@]}"
      - name: Enforce R1/R2/R4 marketplace compliance ratchet
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-marketplace-compliance-baseline.py

  # Verification Pipeline (scoring + badge generation)
  verify:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run verification pipeline
        run: node scripts/run-verification-pipeline.mjs

      - name: Upload verification results
        uses: actions/upload-artifact@v6
        with:
          name: verification-results
          path: .claude-plugin/verification-summary.json
          retention-days: 90

  test:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        test-type: [mcp-plugins, python-tests, validation-scripts]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        if: matrix.test-type == 'mcp-plugins'
        uses: actions/setup-node@v6
        with:
          # astro@6.x (marketplace dep) requires Node >=22.12.0; the
          # `pnpm build` step below builds the marketplace via astro. Node 20
          # hard-fails with "Node.js vXX is not supported by Astro!".
          node-version: '22'

      - name: Setup pnpm
        if: matrix.test-type == 'mcp-plugins'
        uses: pnpm/action-setup@v4

      # plugins/mcp/slack-channel uses `bun test` as its test runner.
      # Other MCP plugins use vitest. Installing bun lets the per-plugin
      # test loop run slack-channel's bun-native tests without forcing a
      # framework migration. (See issue #615.)
      - name: Setup Bun
        if: matrix.test-type == 'mcp-plugins'
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (was `latest`). Resolving `latest` makes setup-bun fetch
          # api.github.com/repos/oven-sh/bun/git/refs/tags unauthenticated, which
          # 503-rate-limits from Actions runner IPs and flaked this required job
          # (the mcp-plugins Bun-503 flake on PR #1076). A pinned version is
          # fetched directly with no tags call. Bump deliberately as Bun releases.
          bun-version: 1.3.14

      - name: Install dependencies
        if: matrix.test-type == 'mcp-plugins'
        run: pnpm install --frozen-lockfile

      - name: Build MCP plugins
        if: matrix.test-type == 'mcp-plugins'
        run: |
          echo "Building MCP plugins..."
          pnpm build
          echo "✅ Build complete"

      # BLOCKING — codebase passed baseline at PR #770 (2026-05-23).
      # All 10 candidate plugins pass `pnpm test`. The original 9 failures
      # in web-to-github-issue were a mix of:
      #   - 4 stale "Use: owner/repo" error-message expectations (updated
      #     to match the improved "Must be owner/repo with valid GitHub
      #     characters" string in the implementation)
      #   - 4 verifyRepo tests expecting graceful `{exists: false, error}`
      #     return on lookup errors (implementation refactored to match
      #     — sanitization of error message preserved)
      #   - 1 parseSearchResults test expecting permissive 3-source output
      #     where URL-validation now correctly drops the no-URL entry to 2
      - name: Run plugin tests (widened loop — every package.json with a test script)
        if: matrix.test-type == 'mcp-plugins'
        run: |
          set -e
          fail=0
          tested=0
          failed_plugins=()
          for package in plugins/*/*/package.json; do
            if [ -f "$package" ]; then
              dir=$(dirname "$package")
              category=$(basename "$(dirname "$dir")")
              plugin_name=$(basename "$dir")

              # Skip SaaS packs — they're skill collections, no runtime tests.
              if [ "$category" = "saas-packs" ]; then continue; fi

              # Check if a test script exists in package.json
              if ! grep -q '"test":' "$package" && ! grep -q '"test:ci":' "$package"; then
                continue
              fi

              # Skip Python-based plugins (tested in python-tests job)
              if grep -q 'pytest' "$package"; then
                echo "⏭️  Skipping $category/$plugin_name (Python plugin, tested separately)"
                continue
              fi

              echo "Testing $category/$plugin_name..."
              cd "$dir"
              tested=$((tested + 1))

              # Workspace members (plugins/mcp/*, plugins/saas-packs/*-pack)
              # get their deps from the root `pnpm install --frozen-lockfile`
              # above. Non-workspace plugins (e.g. skill-enhancers/*) are NOT in
              # pnpm-workspace.yaml, so the root install never populates their
              # node_modules — `pnpm test` would otherwise resolve a tool (e.g.
              # vitest) hoisted from the root at a DIFFERENT major than the one
              # the plugin declares, producing spurious failures like
              # "ReferenceError: __vite_ssr_exportName__ is not defined".
              # Install the plugin's own declared deps in isolation first.
              if [ "$category" != "mcp" ] && [[ "$plugin_name" != *-pack ]]; then
                echo "  ↳ non-workspace plugin — installing its own deps (--ignore-workspace)"
                pnpm install --ignore-workspace
              fi

              if grep -q '"test:ci":' package.json; then
                TEST_CMD=(pnpm test:ci)
              else
                TEST_CMD=(pnpm test -- --run)
              fi
              if "${TEST_CMD[@]}"; then
                echo "✅ Tests passed for $category/$plugin_name"
              else
                fail=1
                failed_plugins+=("$category/$plugin_name")
                echo "::error::$category/$plugin_name tests failed"
              fi

              cd - > /dev/null
            fi
          done

          echo ""
          echo "=== test-loop summary ==="
          echo "Tested: $tested plugins (excluding SaaS packs + Python plugins)"
          if [ $fail -ne 0 ]; then
            echo "Failed: ${#failed_plugins[@]}"
            for p in "${failed_plugins[@]}"; do echo "  - $p"; done
            exit 1
          fi
          echo "All passing."

      - name: Type checking
        if: matrix.test-type == 'mcp-plugins'
        run: |
          echo "Running TypeScript type checking..."
          pnpm typecheck || exit 1
          echo "✅ Type checking passed"

      - name: Linting
        if: matrix.test-type == 'mcp-plugins'
        run: |
          echo "Running linters..."
          pnpm lint || exit 1
          echo "✅ Linting passed"

      - name: Setup Python
        if: matrix.test-type == 'python-tests'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify Snowflake collector bundle integrity
        if: matrix.test-type == 'python-tests'
        run: python3 plugins/saas-packs/snowflake-pack/shared/evidence/sync_bundled_collectors.py --check

      - name: Install Python test dependencies
        if: matrix.test-type == 'python-tests'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          python -m pip install --require-hashes -r freshie/requirements-doltlite.txt

          # Install dependencies if requirements.txt exists
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          # Install dependencies from plugin requirements.txt files
          find plugins/ -name "requirements.txt" | while read -r req; do
            echo "Installing deps from $req"
            pip install -r "$req" || true
          done

          # Install additional testing tools
          pip install pyyaml jsonschema

      - name: Install pinned Dolt for Freshie integration tests
        if: matrix.test-type == 'python-tests'
        run: |
          set -euo pipefail
          readonly dolt_version='2.3.1'
          readonly dolt_sha256='0a2a318f27c5e1088a2883038573c2054e00f356dc9752e74bca934f8321959a'
          readonly dolt_archive="${RUNNER_TEMP}/dolt-linux-amd64-v${dolt_version}.tar.gz"
          readonly dolt_extract="${RUNNER_TEMP}/dolt-v${dolt_version}"
          mkdir -p "$dolt_extract"
          curl --fail --location --silent --show-error \
            "https://github.com/dolthub/dolt/releases/download/v${dolt_version}/dolt-linux-amd64.tar.gz" \
            --output "$dolt_archive"
          printf '%s  %s\n' "$dolt_sha256" "$dolt_archive" | sha256sum --check --strict
          tar -xzf "$dolt_archive" -C "$dolt_extract"
          sudo install -m 0755 "$dolt_extract/dolt-linux-amd64/bin/dolt" /usr/local/bin/dolt
          installed_dolt_version="$(dolt version | awk 'NR == 1 { print $3 }')"
          readonly installed_dolt_version
          test "$installed_dolt_version" = "$dolt_version"

      - name: Run Freshie hermetic publication cycle
        if: matrix.test-type == 'python-tests'
        run: |
          python3 - <<'PY'
          import unittest
          from tests.test_freshie_hermetic_cycle import HermeticFreshieCycleTests

          method_name = "test_full_cycle_uses_only_scratch_state_and_refuses_live_server"
          original_method = HermeticFreshieCycleTests.__dict__[method_name]
          invocations = []

          def guarded_method(self):
              invocations.append(1)
              return original_method(self)

          setattr(HermeticFreshieCycleTests, method_name, guarded_method)
          suite = unittest.TestSuite([HermeticFreshieCycleTests(method_name)])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          valid = (
              result.wasSuccessful()
              and result.testsRun == 1
              and not result.skipped
              and not result.expectedFailures
              and not result.unexpectedSuccesses
              and len(invocations) == 1
              and HermeticFreshieCycleTests.__dict__.get(method_name) is guarded_method
          )
          raise SystemExit(0 if valid else 1)
          PY

      # DoltLite replaces SQLite for its host process. Keep its native tests in
      # a fresh interpreter so pytest-cov and unrelated sqlite3 users retain
      # the stock SQLite library for the repository-wide suite.
      - name: Run native DoltLite tests in an isolated process
        if: matrix.test-type == 'python-tests'
        run: python -W error -m unittest tests.test_doltlite_sync -v

      - name: Run Python tests
        if: matrix.test-type == 'python-tests'
        run: |
          echo "Running Python tests..."

          # Find all Python test files
          TEST_FILES=$(find . -name "test_*.py" -o -name "*_test.py" | grep -v "__pycache__" | grep -v "backups/" || true)

          if [ -n "$TEST_FILES" ]; then
            echo "Found Python test files:"
            echo "$TEST_FILES"

            # Run pytest with coverage
            pytest -v --ignore=tests/test_doltlite_sync.py --cov=. --cov-report=term-missing --cov-report=xml || exit 1
            echo "✅ Python tests passed"
          else
            echo "⚠️  No Python test files found"
          fi

      - name: Setup Python for validation
        if: matrix.test-type == 'validation-scripts'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pyyaml for validation
        if: matrix.test-type == 'validation-scripts'
        run: pip install pyyaml

      - name: Setup Node.js for validation
        if: matrix.test-type == 'validation-scripts'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm for validation
        if: matrix.test-type == 'validation-scripts'
        uses: pnpm/action-setup@v4

      - name: Build ccpi CLI
        if: matrix.test-type == 'validation-scripts'
        run: |
          cd packages/cli
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run validation with universal validator
        if: matrix.test-type == 'validation-scripts'
        run: |
          echo "Testing with universal validator (v5.0)..."

          # 1. Validator smoke test: single known-good skill, standard tier — must exit 0
          echo "Running validator smoke test..."
          python3 scripts/validate-skills-schema.py --standard plugins/ai-ml/ai-ethics-validator/skills/validating-ai-ethics-and-fairness/SKILL.md || exit 1
          echo "✅ Validator runs successfully"

          # 2. Full enterprise report: surface all compliance gaps (non-blocking)
          #    Blocking enforcement deferred until batch migration of tags/compatible-with/line-limits
          echo "Running full enterprise validation (reporting mode)..."
          python3 scripts/validate-skills-schema.py --enterprise --show-low-grades || true
          echo "✅ Enterprise report complete"

          # 3. Single-skill validation test (standard tier — must pass)
          echo "Running single-skill validation..."
          python3 scripts/validate-skills-schema.py --standard plugins/ai-ml/ai-ethics-validator/skills/validating-ai-ethics-and-fairness/SKILL.md || exit 1
          echo "✅ Single-skill validation passed"

          # 4. ccpi validate backward compat
          # TEMPORARY: non-blocking until the frontmatter cleanup campaign
          # clears. Live count as of 2026-07-01: 317 errors of 672 frontmatter
          # items (reproduce: `node packages/cli/dist/index.js validate --strict`,
          # read the "Frontmatter Summary" line). Issue #604 (the original
          # tracker) was CLOSED while 182 errors remained and the count has
          # since GROWN to 317 — the campaign did NOT finish and this gate was
          # never flipped. Re-tracked under #927.
          #
          # REPORT-ONLY-UNTIL: 2026-09-30 (frontmatter --strict campaign; #927)
          # The check-ci-deadlines job (above) FAILS the build once this date
          # passes, so this mitigation cannot rot silently into a permanent
          # bypass. Before the date: clear the errors and flip `|| true` →
          # `|| exit 1` in one PR (the real fix), or extend the date with a
          # documented reason. Flipping now would red-wall every PR (317 errors).
          echo "Running ccpi validate (reporting mode until frontmatter cleanup — see #927; 317 errors as of 2026-07-01)..."
          node packages/cli/dist/index.js validate --strict || true
          echo "✅ ccpi validate complete (non-blocking; report-only until 2026-09-30 — see check-ci-deadlines)"

          echo "✅ All validation tests passed"

      - name: Upload test coverage
        if: matrix.test-type == 'python-tests' && always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  # Package Manager Policy Enforcement
  check-package-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run package manager policy check
        run: node scripts/check-package-manager.mjs

  # Marketplace Validation Gates
  marketplace-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Astro requires >=22.12.0 as of 2026-05-30. Bumped to clear the
          # pre-existing failure that started 2026-05-30 22:58Z on main.
          node-version: 22

      - name: Install marketplace dependencies
        run: |
          cd marketplace
          npm install

      - name: Build marketplace
        run: |
          cd marketplace
          npm run build

      - name: Validate Playbook Routes (source + dist)
        run: node marketplace/scripts/validate-playbook-routes.mjs --dist

      - name: Validate Internal Links (dist)
        run: node marketplace/scripts/validate-internal-links.mjs

      - name: Validate permanent skill redirect projection
        run: node --test marketplace/scripts/skill-redirects.test.mjs marketplace/scripts/install-skill-redirects.test.mjs

      - name: Smoke Test - Verify Build Output
        run: |
          echo "Running smoke tests on marketplace build output..."

          # 1. Verify dist/index.html exists and is valid HTML
          if [ ! -f "marketplace/dist/index.html" ]; then
            echo "ERROR: marketplace/dist/index.html not found"
            exit 1
          fi

          if ! grep -q "<!DOCTYPE html>" marketplace/dist/index.html; then
            echo "ERROR: Missing DOCTYPE in index.html"
            exit 1
          fi

          if ! grep -q "Claude Code" marketplace/dist/index.html; then
            echo "ERROR: Missing expected content in index.html"
            exit 1
          fi

          echo "✓ index.html exists and is valid"

          # 2. Verify at least one plugin page exists
          PLUGIN_COUNT=$(find marketplace/dist/plugins -name "index.html" -type f 2>/dev/null | wc -l)
          if [ "$PLUGIN_COUNT" -lt 1 ]; then
            echo "ERROR: No plugin pages found in marketplace/dist/plugins/"
            exit 1
          fi
          echo "✓ Found $PLUGIN_COUNT plugin pages"

          # 3. Verify /explore/index.html exists
          if [ ! -f "marketplace/dist/explore/index.html" ]; then
            echo "ERROR: marketplace/dist/explore/index.html not found"
            exit 1
          fi
          echo "✓ Explore page exists"

          # 4. Verify /skills/index.html exists
          if [ ! -f "marketplace/dist/skills/index.html" ]; then
            echo "ERROR: marketplace/dist/skills/index.html not found"
            exit 1
          fi
          echo "✓ Skills page exists"

          # 5. Check max line length for iOS Safari compatibility
          MAX_LINE=$(wc -L marketplace/dist/index.html | awk '{print $1}')
          if [ "$MAX_LINE" -gt 5000 ]; then
            echo "WARNING: HTML line too long ($MAX_LINE chars). iOS Safari may fail to render."
          else
            echo "✓ HTML line length OK ($MAX_LINE chars)"
          fi

          # 6. Verify /cowork/index.html exists
          if [ ! -f "marketplace/dist/cowork/index.html" ]; then
            echo "ERROR: marketplace/dist/cowork/index.html not found"
            exit 1
          fi
          echo "✓ Cowork page exists"

          # 7. Verify downloads manifest exists
          if [ ! -f "marketplace/dist/downloads/manifest.json" ]; then
            echo "ERROR: marketplace/dist/downloads/manifest.json not found"
            exit 1
          fi
          echo "✓ Downloads manifest exists"

          # 8. Verify plugin zips generated
          PLUGIN_ZIP_COUNT=$(find marketplace/dist/downloads/plugins -name "*.zip" -type f 2>/dev/null | wc -l)
          if [ "$PLUGIN_ZIP_COUNT" -lt 1 ]; then
            echo "ERROR: No plugin zips in marketplace/dist/downloads/plugins/"
            exit 1
          fi
          echo "✓ Found $PLUGIN_ZIP_COUNT plugin zips"

          echo "✅ All smoke tests passed"

      - name: Validate Cowork Downloads
        run: node marketplace/scripts/validate-cowork-downloads.mjs

      - name: Validate Cowork Manifest Drift
        # Catalog ↔ manifest ↔ disk alignment gate. Complements
        # validate-cowork-downloads.mjs (manifest → disk presence) by also
        # walking disk → manifest (orphan detection) and catalog → manifest.
        # See CLAUDE.md § "Auto-cowork contract" for the invariant.
        run: node scripts/validate-cowork-manifest.mjs

      - name: Validate Cowork Security
        run: node scripts/validate-cowork-security.mjs

      - name: Validate routes
        run: node scripts/check-routes.mjs

      - name: Validate official links
        run: node scripts/check-official-links.mjs

      - name: Performance budget check
        run: node scripts/check-performance.mjs

  # CLI Smoke Tests (EPIC D - D3)
  cli-smoke-tests:
    runs-on: ubuntu-latest
    needs: marketplace-validation
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install CLI dependencies
        run: |
          cd packages/cli
          pnpm install --frozen-lockfile

      - name: Build CLI
        run: |
          cd packages/cli
          pnpm build

      - name: Verify bin entrypoint is executable
        run: |
          if [ ! -x packages/cli/dist/index.js ]; then
            echo "❌ CLI bin entrypoint is not executable"
            exit 1
          fi
          echo "✅ CLI bin entrypoint is executable"

      - name: Test CLI --help
        run: |
          cd packages/cli
          if node dist/index.js --help; then
            echo "✅ CLI --help works"
          else
            echo "❌ CLI --help failed"
            exit 1
          fi

      - name: Test CLI --version
        run: |
          cd packages/cli
          if node dist/index.js --version; then
            echo "✅ CLI --version works"
          else
            echo "❌ CLI --version failed"
            exit 1
          fi

      - name: Test CLI doctor command
        run: |
          cd packages/cli
          if node dist/index.js doctor --help; then
            echo "✅ CLI doctor --help works"
          else
            echo "❌ CLI doctor --help failed"
            exit 1
          fi

      - name: Test CLI validate command
        run: |
          cd packages/cli
          if node dist/index.js validate --help; then
            echo "✅ CLI validate --help works"
          else
            echo "❌ CLI validate --help failed"
            exit 1
          fi

      - name: Test CLI install command options
        run: |
          cd packages/cli
          if node dist/index.js install --help; then
            echo "✅ CLI install --help works"
          else
            echo "❌ CLI install --help failed"
            exit 1
          fi

      - name: Verify no workspace dependencies
        run: |
          if grep -q "workspace:" packages/cli/package.json; then
            echo "❌ CLI has workspace: dependencies - will break at runtime!"
            exit 1
          fi
          echo "✅ CLI has no workspace dependencies"

      - name: Test npm pack
        run: |
          cd packages/cli
          if npm pack; then
            echo "✅ npm pack works"
            ls -lh ./*.tgz
          else
            echo "❌ npm pack failed"
            exit 1
          fi

      # Bundle size budget (issue #591). Caps the gzipped JS shipped to npm
      # so install latency stays bounded as the CLI grows. Budget is set ~50%
      # above the current size (currently ~27 KB → 40 KB ceiling). Tighten
      # the limit in .size-limit.json after every shrink. MCP plugins are
      # intentionally excluded — they're server-side, not install-latency-bound.
      - name: Bundle size budget
        run: |
          cd packages/cli
          pnpm exec size-limit

  # ──────────────────────────────────────────────────────────────────────
  # Script-quality gates — added 2026-05-20 to close blind spots flagged
  # in the audit (post-#756). Previously CI checked plugin STRUCTURE (README,
  # SKILL.md frontmatter, catalog consistency) but didn't actually look at
  # the scripts shipped INSIDE skills. These three jobs fix that:
  #
  #   shellcheck-skills              — syntax-check + lint every .sh in plugins/
  #   skill-codeblock-syntax         — syntax-check fenced code blocks in
  #                                    SKILL.md / README.md (python, bash, js)
  #   typescript-coverage-audit      — flag TS files in plugins/ whose
  #                                    enclosing package.json doesn't define
  #                                    a `typecheck` script (so they slip
  #                                    past `pnpm --filter '*' typecheck`)
  #
  # The two markdown / TS-coverage gates run in REPORT-ONLY mode initially —
  # they print findings but exit 0. Flip to enforcing once the cleanup PR
  # lands (separate bead). See PR that added these for the rollout plan.
  # ──────────────────────────────────────────────────────────────────────

  shellcheck-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2

      # BLOCKING — codebase passed baseline at PR #768 (2026-05-22, 223→0).
      # .shellcheckrc at repo root governs disable= directives.
      # No `|| true` swallow: external PRs that introduce shellcheck
      # warnings or errors fail this gate.
      - name: Run shellcheck (severity=warning) across plugins/**/*.sh
        run: |
          set -e
          # Build list of .sh files to check, EXCLUDING:
          #   - node_modules
          #   - upstream-synced plugin dirs (any dir containing .source.json
          #     in its plugin root — those scripts are the upstream
          #     maintainer's responsibility, and the next weekly sync will
          #     overwrite any fixes we apply here)
          synced_dirs=$(find plugins -maxdepth 3 -name '.source.json' -type f -exec dirname {} \;)
          declare -a prune_args=()
          for d in $synced_dirs; do
            prune_args+=(-not -path "$d/*")
          done
          count=$(find plugins -name '*.sh' -not -path '*/node_modules/*' "${prune_args[@]}" -type f | wc -l)
          echo "Shellchecking $count .sh files at severity=warning..."
          echo "Excluded $(echo "$synced_dirs" | wc -l) upstream-synced plugin dirs."
          find plugins -name '*.sh' -not -path '*/node_modules/*' "${prune_args[@]}" -type f -print0 \
            | xargs -0 shellcheck --severity=warning --shell=bash

  skill-codeblock-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js (for js codeblock syntax checks)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # BLOCKING — codebase passed baseline at PR #771 (2026-05-23).
      # 5,991 of 16,298 fenced code blocks checked (only python/bash/sh/
      # javascript get syntax-checked; typescript, json, yaml, text, etc.
      # are skipped per scripts/lint-skill-codeblocks.py CHECKABLE set).
      # The 97 baseline failures were all mislabeled language tags:
      #   - 7 python blocks containing slash-commands / Datadog DSL /
      #     JSON / ASCII trees / shell — relabeled to text/json/bash
      #   - 24 javascript blocks containing Firestore Security Rules /
      #     YAML / pedagogical vulnerable+secure comparisons — relabeled
      #     to text/yaml/json
      #   - 66 bash blocks containing CLI usage with <placeholder>
      #     brackets ("python script.py <input>") — relabeled to text
      #     (these are illustrative examples, not literal runnable cmds)
      - name: Lint fenced code blocks in SKILL.md / README.md
        run: |
          python3 scripts/lint-skill-codeblocks.py --root plugins

  typescript-coverage-audit:
    runs-on: ubuntu-latest
    steps:

name: Check Markdown Links

# Runs lychee against every .md file in the repo. Catches broken intra-repo
# relative links AND broken external links. Required on PRs touching .md;
# also runs weekly on a schedule so external-host rot gets surfaced.
#
# Gap this closes: prior to 2026-05-30 the repo had no broken-link checker.
# A link in issue #789 (and later in PR #805's pre-merge body) pointed at a
# gitignored file path; no CI gate caught it because no link checker existed.
# This workflow + .lychee.toml at the repo root close the repo-side half of
# that gap. The live-issue-body half is closed by check-issue-body-links.yml.

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.github/workflows/check-links.yml'
  schedule:
    # Mondays 05:00 UTC — catch external-host rot weekly.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  # #1450: a superseded push to a PR branch cancels its stale run; main and
  # scheduled runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  link-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scan: [repo, marketplace]
    steps:
      - uses: actions/checkout@v7

      - name: Select reviewed PR link inputs
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          LINK_SCAN: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          # A PR cannot provide the code that narrows its own link coverage.
          helper="scripts/ci/link_scope.py"
          if [ "$EVENT_NAME" = pull_request ] && [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            if git cat-file -e "$PR_BASE_SHA:$helper" 2>/dev/null; then
              trusted=$(mktemp "$RUNNER_TEMP/link-scope.XXXXXX.py")
              git show "$PR_BASE_SHA:$helper" > "$trusted"
              python3 "$trusted" --base "$PR_BASE_SHA" --scan "$LINK_SCAN" --output "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          printf 'full=true\nrun=true\ninputs=\n' >> "$GITHUB_OUTPUT"

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ matrix.scan }}-${{ github.sha }}
          restore-keys: cache-lychee-${{ matrix.scan }}-

      # Two lychee invocations because the marketplace blog content uses
      # root-relative URLs (`/posts/foo`, `/explore`) that Astro renders
      # against https://tonsofskills.com at build time. Lychee needs --base
      # for those to resolve as live URLs. Repo-side .md files (READMEs,
      # 000-docs, skill bodies) don't use root-relative paths so they scan
      # without a base.

      - name: Run lychee (repo-side markdown)
        if: matrix.scan == 'repo' && steps.scope.outputs.run == 'true'
        id: lychee_repo
        uses: lycheeverse/lychee-action@v2
        with:
          # lycheeVersion stays on the action's default (currently v0.23.0).
          # Attempted v0.24.2 pin to fix the exclude_path regression but the
          # action's tarball extraction doesn't handle v0.24's restructured
          # archive (nested binary). Workaround: pass exclude paths via CLI
          # --exclude-path flags, which v0.23.0 honors. The .lychee.toml
          # exclude_path is kept as the source of truth for local runs and
          # for whichever future action version handles v0.24+ packaging.
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}
            --no-progress
            --cache
            --max-cache-age 1d
            --exclude-path 'marketplace/src/content'
            --exclude-path 'plugins/skill-enhancers/axiom/docs'
            --exclude-path 'tests/fixtures'
            --exclude-path 'node_modules'
            --exclude-path 'marketplace/dist'
            --exclude-path 'marketplace/.astro'
            --exclude-path 'marketplace/.cache'
            --exclude-path 'marketplace/public/downloads'
            --exclude-path 'plugins/[^/]+/dist'
            --exclude-path 'plugins/[^/]+/node_modules'
            --exclude-path 'freshie/cache'
            --exclude-path '.audit-harness'
            --exclude-path 'coverage'
            --exclude-path '.pnpm-store'
            ${{ steps.scope.outputs.full == 'true' && '"./**/*.md" "./**/*.mdx"' || steps.scope.outputs.inputs }}
          # Never red-X a PR on link results — external-host flakiness (conn
          # resets, rate-limits) produced ~200 false failures that read as
          # repo noise. Link rot is surfaced by the weekly scheduled run +
          # the report artifact instead, not by blocking contributor PRs.
          fail: false
          # A proven changed document can legitimately contain no links.
          # Full scans still reject an unexpectedly empty corpus.
          failIfEmpty: ${{ steps.scope.outputs.full == 'true' }}
          output: ./lychee-repo-report.md

      - name: Run lychee (marketplace content with site base)
        if: matrix.scan == 'marketplace' && steps.scope.outputs.run == 'true'
        id: lychee_marketplace
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --base https://tonsofskills.com
            --no-progress
            --cache
            --max-cache-age 1d
            ${{ steps.scope.outputs.full == 'true' && '"marketplace/src/content/**/*.md" "marketplace/src/content/**/*.mdx"' || steps.scope.outputs.inputs }}
          # See note above — never block a PR on link results.
          fail: false
          # A proven changed document can legitimately contain no links.
          # Full scans still reject an unexpectedly empty corpus.
          failIfEmpty: ${{ steps.scope.outputs.full == 'true' }}
          output: ./lychee-marketplace-report.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-reports-${{ github.run_id }}-${{ matrix.scan }}
          path: |
            ./lychee-repo-report.md
            ./lychee-marketplace-report.md
          if-no-files-found: ignore
          retention-days: 30

      # Lychee deliberately exits successfully on findings. Inspect its output
      # too; never send secrets or notifications from a contributor PR run.
      - name: Alert Slack on scheduled failure or broken links
        if: >-
          always() && !cancelled() && github.event_name != 'pull_request' &&
          (failure() ||
           (matrix.scan == 'repo' && steps.scope.outputs.run == 'true' && steps.lychee_repo.outputs.exit_code != '0') ||
           (matrix.scan == 'marketplace' && steps.scope.outputs.run == 'true' && steps.lychee_marketplace.outputs.exit_code != '0'))
        env:
          WEBHOOK: ${{ secrets.SLACK_OPERATION_HIRED_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_TEXT: 'check-links.yml failed or found broken links; inspect the report.'
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Slack alert cannot be delivered: webhook is not configured."
            exit 1
          fi
          PAYLOAD=$(jq -n --arg text "$ALERT_TEXT <$RUN_URL|View run>" '{text: $text}')
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' --data "$PAYLOAD" \
            -- "$WEBHOOK" > /dev/null
          echo "Slack alert delivered."

  link-check:
    if: always()
    needs: link-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require both link scans to complete successfully
        env:
          SCAN_RESULT: ${{ needs.link-scan.result }}
        run: test "$SCAN_RESULT" = success

name: Kernel Vendor Version Coupling (advisory)

# ADVISORY / REPORT-ONLY — the VERSION-COUPLING CONSISTENCY MODEL for
# @intentsolutions/core (the Spec Authority Kernel). Implements plan 033 § 14.15.
#
# WHAT THIS CHECKS
#   The three version identities and their ordering invariant:
#     (V) vendored snapshot version   — .kernel-vendor/authoring/v1/index.json
#                                        $schemaVersion, OR (today) the installed
#                                        @intentsolutions/core pin in node_modules.
#     (C) CCPI-declared kernel          — the exact package.json pin.
#     (K) kernel latest published      — npm @intentsolutions/core / the sibling repo.
#   The invariant: V <= C <= K. Plus bounded staleness: the vendored snapshot may
#   lag the kernel latest by <= 7 calendar days; beyond that, staleness is REPORTED.
#
# SOAK DISCIPLINE — INTENTIONALLY NON-AUTHORITATIVE
#   The CCPI kernel pin tracks the latest published kernel (currently 0.10.0). This
#   gate is ORTHOGONAL to the advisory->blocking authority flip:
#   it polices VERSION ORDERING + STALENESS only and must NEVER change validator
#   authority or pressure a pin bump on its own. Therefore:
#     * It is NOT in the branch-protection required-status set.
#     * The check step uses `continue-on-error: true` (advisory; exit 0 by default).
#     * On a >7-day staleness it REPORTS (and, POST-DR-049-FLIP, would open a
#       kernel-bump PR — that auto-PR is a DEFERRED ACTION, not wired here).
#
# Promotion to blocking (drop continue-on-error, run with --strict) is a SEPARATE
# step that lands only WITH the DR-049 advisory->authoritative flip — NOT this PR.
#
# Beads: k8wo (kernel-vendor consistency model — version-coupling).

on:
  workflow_dispatch:
    inputs:
      kernel_latest_override:
        description: 'Test-only K override for exercising the advisory violation lane; leave blank for npm latest.'
        required: false
        type: string
      kernel_published_override:
        description: 'Test-only published-at override paired with kernel_latest_override; leave blank for npm metadata.'
        required: false
        type: string
  pull_request:
    paths:
      - 'scripts/kernel-vendor-hash.mjs'
      - 'scripts/kernel-vendor-hash.test.mjs'
      - 'scripts/validate-skills-schema.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.kernel-vendor/**'
      - '.github/workflows/kernel-vendor-hash.yml'
  schedule:
    # Daily staleness sweep — catches a kernel release that ages past the 7-day
    # bound even when no CCPI PR touches the pin. Advisory: reports, never blocks.
    - cron: '17 7 * * *'

# Read-only — the advisory check never needs write scope. (The deferred auto-bump
# PR, post-flip, would add `pull-requests: write` then.)
permissions:
  contents: read

concurrency:
  group: kernel-vendor-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-vendor-hash:
    name: kernel-vendor-hash (advisory, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Installs @intentsolutions/core@0.10.0 (exact pin) so the script can resolve
      # V from node_modules in the absence of a .kernel-vendor/ snapshot.
      - name: Install root dev dependencies
        run: pnpm install --frozen-lockfile --filter "claude-code-plugins-monorepo"

      # BLOCKING — the version-ordering invariant test corpus (F-MK-003). This is
      # NOT advisory: it exercises the V <= C <= K comparator (`evaluateCoupling` +
      # `semverCompare`) with synthetic positive/negative/staleness fixtures and the
      # CLI advisory-vs-strict exit-code contract. Correctness of the comparator is
      # ORTHOGONAL to the DR-049 soak (which only governs pin-bump pressure / validator
      # authority) — a broken comparator is a real bug, so a failing corpus turns this
      # check red. Uses node's built-in runner (zero new deps).
      - name: Version-ordering invariant test corpus (blocking)
        run: node --test scripts/kernel-vendor-hash.test.mjs

      # K (kernel latest published) is resolved from npm in CI — the read-only
      # sibling repo is not checked out here. Pass it explicitly so C <= K and the
      # staleness age can be evaluated. `npm view` is read-only.
      - name: Resolve kernel latest published version
        id: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          K="$(npm view @intentsolutions/core version 2>/dev/null || true)"
          PUB="$(npm view @intentsolutions/core time.modified 2>/dev/null || true)"
          echo "latest=${K}" >> "$GITHUB_OUTPUT"
          echo "published=${PUB}" >> "$GITHUB_OUTPUT"
          echo "resolved K=${K} published=${PUB}"

      # The single advisory step. continue-on-error guarantees a harness failure
      # (or a real ordering/staleness violation) can NEVER turn this check red in a
      # blocking way during the soak. The script itself defaults to exit 0.
      - name: Run kernel vendor version-coupling check (report-only)
        id: vendor-hash
        continue-on-error: true
        run: |
          set -euo pipefail
          ARGS=""
          KERNEL_LATEST="${{ inputs.kernel_latest_override || steps.kernel.outputs.latest }}"
          KERNEL_PUBLISHED="${{ inputs.kernel_published_override || steps.kernel.outputs.published }}"
          if [ -n "$KERNEL_LATEST" ]; then
            ARGS="--kernel-latest $KERNEL_LATEST"
          fi
          if [ -n "$KERNEL_PUBLISHED" ]; then
            ARGS="$ARGS --kernel-published $KERNEL_PUBLISHED"
          fi
          # shellcheck disable=SC2086
          node scripts/kernel-vendor-hash.mjs $ARGS | tee "$GITHUB_STEP_SUMMARY" || true
          if jq -e '.violations | length > 0' scripts/.kernel-vendor-hash/report.json > /dev/null; then
            echo "violation=true" >> "$GITHUB_OUTPUT"
            echo "Kernel coupling violation detected; human notification will run."
          else
            echo "violation=false" >> "$GITHUB_OUTPUT"
          fi

      # The coupling check stays advisory and out of branch protection. A real
      # violation must nevertheless reach a human-readable lane; silently
      # printing it in an Actions summary recreated the stale-pin blind spot.
      - name: Alert Slack on kernel coupling violation
        if: steps.vendor-hash.outputs.violation == 'true'
        env:
          WEBHOOK: ${{ secrets.SLACK_OPERATION_HIRED_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_OPERATION_HIRED_WEBHOOK_URL not set; skipping alert."
            exit 0
          fi
          PAYLOAD=$(python3 - "$RUN_URL" <<'PY'
          import json, sys
          run_url = sys.argv[1]
          text = (
              "⚠️ *Kernel vendor version-coupling violation* — "
              "the advisory V ≤ C ≤ K / staleness check found a breach. "
              f"<@U099CBRE7CL> <{run_url}|View run>"
          )
          print(json.dumps({"text": text}))
          PY
          )
          curl --silent --show-error --fail \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            -- "$WEBHOOK" > /dev/null
          echo "✓ Slack kernel-coupling violation alert posted."

      - name: Upload version-coupling report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-vendor-hash-report
          path: scripts/.kernel-vendor-hash/report.json
          if-no-files-found: warn

name: Kernel Shadow Validation (advisory)

# ADVISORY / REPORT-ONLY — consumer-cutover STEP 1 for @intentsolutions/core.
#
# This workflow runs the kernel's published authoring/v1 baseline and strict
# authoring/v2 skill-frontmatter JSON Schemas from @intentsolutions/core (pinned
# EXACTLY to 0.10.0 in package.json) over the same SKILL.md corpus the existing
# prose-spec validator (scripts/validate-skills-schema.py) grades. The summary
# leads with strict-v2 existing-PASS / kernel-FAIL — the only decision-relevant
# number for a future authority flip — while retaining the v1 scope comparison.
# The agent step separately observes composed v1/v2 agent-definition contracts
# over canonical Python discovery, retaining raw comparisons and scope limits.
#
# GUARDRAILS — this workflow is INTENTIONALLY non-authoritative:
#   * It is NOT in the branch-protection required-status set. It can never make a
#     PR un-mergeable.
#   * The validation step uses `continue-on-error: true`, so even a harness crash
#     surfaces as a neutral/annotation, never a red required check.
#   * It reads existing verdicts via skill JSON or canonical agent functions;
#     it never changes those verdicts or their authority. Python/R1 remain
#     blocking; kernel disagreements are evidence only.
#   * The deviation rate is REPORTED (job summary + artifact), never enforced.
#
# Promotion to a blocking gate is a SEPARATE, later cutover step that requires
# the deviation rate to be understood and driven down first — NOT this PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kernel-shadow-validation.mjs'
      - 'scripts/kernel-shadow-registry.mjs'
      - 'scripts/kernel-shadow-validation.test.mjs'
      - 'scripts/kernel-shadow-agents.mjs'
      - 'scripts/kernel-shadow-agents.py'
      - 'scripts/kernel-shadow-agents.test.mjs'
      - 'scripts/validate-mcp-config.mjs'
      - 'scripts/validate-skills-schema.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'plugins/**/SKILL.md'
      - 'skills/**/SKILL.md'
      - 'plugins/**/agents/**/*.md'
      - '.claude/agents/**/*.md'
      - 'workspace/**/agents/**/*.md'
      - 'plugins/**/.mcp.json'
      - 'plugins/**/.claude-plugin/plugin.json'
      - '.github/workflows/kernel-shadow-validation.yml'

# Read-only — the shadow never needs write scope.
permissions:
  contents: read

concurrency:
  group: kernel-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-shadow:
    name: kernel-shadow (advisory, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python (for the existing prose-spec validator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pyyaml (existing validator dependency)
        run: python3 -m pip install --quiet pyyaml

      # Installs @intentsolutions/core@0.10.0 (exact pin) + ajv + ajv-formats +
      # js-yaml — the shadow's dependencies — from the frozen lockfile.
      - name: Install root dev dependencies
        run: pnpm install --frozen-lockfile --filter "claude-code-plugins-monorepo"

      - name: Exercise advisory registry report transport with synthetic fixtures
        continue-on-error: true
        run: node --test scripts/kernel-shadow-validation.test.mjs

      # The single advisory step. continue-on-error guarantees a harness failure
      # can never turn this check red in a blocking way.
      - name: Run kernel shadow validation (report-only)
        id: shadow
        continue-on-error: true
        run: node scripts/kernel-shadow-validation.mjs

      - name: Exercise agent shadow with synthetic failure fixtures
        continue-on-error: true
        run: node --test scripts/kernel-shadow-agents.test.mjs

      # Raw agent comparisons do not replace the authoritative Python/R1 gates.
      # A failed observation must remain visible without making this blocking.
      - name: Compare agent corpus against composed v1/v2 schemas (advisory)
        id: agent-shadow
        continue-on-error: true
        run: node scripts/kernel-shadow-agents.mjs

      # ADVISORY MCP config validation against the kernel's authoring/v1
      # mcp-config composition. Same guardrails as the shadow step above:
      # continue-on-error, default-advisory exit 0, findings reported in the
      # step summary — never gates. The --strict flip is a separate, later
      # cutover step (DR-049 soak).
      - name: Validate MCP configs against the kernel (advisory)
        id: mcp-config
        continue-on-error: true
        run: node scripts/validate-mcp-config.mjs

      - name: Upload deviation report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-shadow-deviation-report
          path: |
            scripts/.kernel-shadow/report.json
            scripts/.kernel-shadow/agents-report.json
            scripts/.kernel-shadow/registry-fixture-proof/
          include-hidden-files: true
          if-no-files-found: warn

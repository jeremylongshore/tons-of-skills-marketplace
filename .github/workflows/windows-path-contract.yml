name: Windows path contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-path-contract.yml'
      - 'scripts/**'
      - 'marketplace/scripts/**'
      - 'tests/test_sync_marketplace_root_resolution.py'

# Advisory real-Windows evidence for repository generators. The same contract
# tests run in required Linux jobs; this job must remain outside ci-required
# because hosted-runner availability is provider-dependent.
permissions:
  contents: read

concurrency:
  group: windows-path-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-path-contract:
    name: Windows path contract (hosted)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Windows path regression corpus
        # The two marketplace installer suites execute POSIX Bash/Caddy
        # transaction fixtures. Required Linux CI still covers their
        # fileURLToPath changes; they are not Windows runtime contracts.
        run: >-
          node --test
          scripts/generate-plugin-package-jsons.test.mjs
          scripts/check-generated-artifacts.test.mjs
          scripts/check-mirror-quarantine.test.mjs
          scripts/scan-synced-content.test.mjs
          marketplace/scripts/discover-skills.test.mjs

      - name: Verify sync roots on Windows
        run: python -m unittest tests.test_sync_marketplace_root_resolution -v

      - name: Verify package generation remains a no-op
        run: node scripts/generate-plugin-package-jsons.mjs --dry-run

      - name: Verify generated-artifact Git root from a nested directory
        working-directory: scripts
        run: node check-generated-artifacts.mjs

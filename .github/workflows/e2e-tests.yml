name: E2E Tests

# Heavy tests — Playwright UI suite + production-e2e against tonsofskills.com.
# Combined runtime ~14 min. Trigger policy is tiered:
#
#   1. Path-filtered PRs — only fire when the diff actually touches UI surface
#      that could break visually. Catalog-only PRs, doc PRs, plugin-content
#      PRs, and CI config PRs don't run these. (playwright-tests job only.)
#   2. Push to main — always run after merge so we catch any regression that
#      slipped through the path filter. (playwright-tests job only.)
#   3. workflow_dispatch — manual opt-in for PRs that fell outside the path
#      filter but need a sanity check (e.g., catalog PR that touches a featured
#      plugin's spotlight). Run via: gh workflow run e2e-tests.yml --ref <branch>.
#   4. workflow_run on "Deploy tonsofskills.com to VPS" completion —
#      production-e2e ONLY. It used to also run on push:main, which raced the
#      VPS deploy (same trigger, different concurrency groups): the suite hit
#      live tonsofskills.com while rsync was mid-flight or not yet started, so
#      it asserted against the PRE-deploy site — false red on content about to
#      ship, or false green masking a regression the new deploy introduced.
#      Gating on the deploy workflow's successful completion guarantees prod
#      E2E only ever tests the site the deploy actually landed.
#      (Ops-review bead claude-k0h2, deploy-test-race finding.)
#
# Required-check policy: NOT in the required-checks set. validate +
# marketplace-validation cover the spec gates. E2E catches visual/runtime
# regressions; failures here are signal, not gate.

on:
  workflow_dispatch:
  # Fires production-e2e after the VPS deploy finishes (tier 4 above). The
  # deploy lives in a separate workflow (deploy-vps.yml → SHA-pinned reusable
  # vps-deploy), so `needs:` can't express the ordering — workflow_run can.
  workflow_run:
    workflows: ['Deploy tonsofskills.com to VPS']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'marketplace/src/components/**'
      - 'marketplace/src/pages/**'
      - 'marketplace/src/layouts/**'
      - 'marketplace/src/styles/**'
      - 'marketplace/src/scripts/**'
      - 'marketplace/scripts/preview.mjs'
      - 'marketplace/package.json'
      - 'marketplace/public/**'
      # Regenerated catalog data (JSON) is not a UI change — excluding it stops
      # every plugin PR (which touches this dir via sync-marketplace) from
      # triggering the ~14-min Playwright E2E. Honors this workflow's own policy.
      - '!marketplace/public/data/**'
      - 'marketplace/astro.config.mjs'
      - 'marketplace/playwright.config.ts'
      - 'marketplace/playwright.production.config.ts'
      - 'marketplace/tests/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'marketplace/src/components/**'
      - 'marketplace/src/pages/**'
      - 'marketplace/src/layouts/**'
      - 'marketplace/src/styles/**'
      - 'marketplace/src/scripts/**'
      - 'marketplace/scripts/preview.mjs'
      - 'marketplace/package.json'
      - 'marketplace/public/**'
      # Regenerated catalog data (JSON) is not a UI change — excluding it stops
      # every plugin PR (which touches this dir via sync-marketplace) from
      # triggering the ~14-min Playwright E2E. Honors this workflow's own policy.
      - '!marketplace/public/data/**'
      - 'marketplace/astro.config.mjs'
      - 'marketplace/playwright.config.ts'
      - 'marketplace/playwright.production.config.ts'
      - 'marketplace/tests/**'
      - '.github/workflows/e2e-tests.yml'

# Cancel in-flight runs when a new push lands on the same PR/branch. The
# event name is part of the group so a deploy-completion (workflow_run,
# ref=main) run can never cancel an in-flight push:main playwright-tests run —
# they are different lanes; only same-lane runs supersede each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Playwright UI tests against a locally-built marketplace. PROOF GATE for
  # UI-touching PRs — catches breakage before it reaches production.
  playwright-tests:
    runs-on: ubuntu-latest
    # Deploy-completion events are production-e2e's lane (tier 4); this job
    # keeps its existing PR / push:main / dispatch triggers only.
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Astro requires >=22.12.0 as of 2026-05-30. Job builds the
          # marketplace before running Playwright, so it needs Node 22.
          node-version: 22

      - name: Install marketplace dependencies
        run: |
          cd marketplace
          npm install --ignore-scripts

      - name: Install Playwright
        run: |
          cd marketplace
          npm install -D @playwright/test

      - name: Install Playwright browsers
        run: |
          cd marketplace
          npx playwright install --with-deps chromium webkit

      - name: Build marketplace
        run: |
          cd marketplace
          npm run build

      - name: Run Playwright tests
        run: |
          cd marketplace
          npx playwright test --reporter=html,github
        env:
          CI: true

      # A11y smoke tests (issue #588) — gate-wired-but-non-blocking. The spec
      # baselines the current violation count per page; cleanup is tracked
      # separately under the a11y-cleanup-followup workstream. Run explicitly
      # so the result shows up as its own CI step.
      - name: Run a11y baseline tests
        run: |
          cd marketplace
          npx playwright test tests/a11y/ --reporter=list
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: marketplace/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-screenshots
          path: marketplace/test-results/screenshots/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-videos
          path: marketplace/test-results/**/video.webm
          retention-days: 7

  # Production E2E against live tonsofskills.com. No build needed — drives a
  # real browser against the deployed site. Useful for detecting deploy/CDN
  # issues that local builds can't catch.
  production-e2e:
    runs-on: ubuntu-latest
    # Runs ONLY after a SUCCESSFUL deploy (workflow_run tier 4 above) or on
    # manual dispatch — never on push:main/PR events, which raced the deploy
    # and tested the pre-deploy site. A failed/cancelled deploy runs nothing:
    # the deploy's own healthz + smoke checks already flagged it, and testing
    # a site the deploy never touched is noise.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # The runner installs marketplace/package.json, whose engine follows
          # the repository floor even though this job does not rebuild Astro.
          node-version: 22

      - name: Install marketplace dependencies
        run: |
          cd marketplace
          npm install --ignore-scripts

      - name: Install Playwright
        run: |
          cd marketplace
          npm install -D @playwright/test

      - name: Install Playwright browsers
        run: |
          cd marketplace
          npx playwright install --with-deps chromium webkit

      - name: Run production E2E tests
        run: |
          cd marketplace
          npx playwright test --config=playwright.production.config.ts --reporter=html,github
        env:
          CI: true

      - name: Upload production E2E report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-e2e-report
          path: marketplace/production-e2e-report/
          retention-days: 30

name: CLI Cross-Platform Testing

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - '.github/workflows/cli-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - '.github/workflows/cli-test.yml'

jobs:
  test-cli:
    name: Test CLI - ${{ matrix.os }} - ${{ matrix.package-manager }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package-manager: [npm, bun, pnpm]
        # Maintained Node lines only. 18 reached end of life 2025-04-30 and 20 on
        # 2026-04-30; the CLI stopped claiming them on 2026-09-25.
        node-version: [22, 24]

        # Exclude some combinations to reduce CI time
        exclude:
          # Only test Node 22 on Windows (faster)
          - os: windows-latest
            node-version: 24

          # Only test bun on Ubuntu and macOS (not Windows compatible)
          - os: windows-latest
            package-manager: bun

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --ignore-scripts: the CLI has no dependency that needs an install script
      # (esbuild ships its binary as an optional platform package). A filtered
      # install still installs the repository root's devDependencies, and
      # without this flag every job natively builds better-sqlite3 for
      # @intentsolutions/jrig-cli, which the CLI never loads. That build needed
      # a pinned node-gyp on Windows while Windows ran Node 20, which has no
      # better-sqlite3 prebuild; skipping scripts removes the dependency on it.
      - name: Install dependencies (CLI and dependencies)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@intentsolutionsio/ccpi...'

      - name: Build CLI
        run: pnpm -C packages/cli build

      - name: Run CLI contract and unit tests
        run: pnpm -C packages/cli test

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f packages/cli/dist/index.js ]; then
            echo "❌ Build failed: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build successful: dist/index.js exists"

      - name: Test CLI version (npm)
        if: matrix.package-manager == 'npm'
        working-directory: packages/cli
        run: node dist/index.js --version

      - name: Test CLI version (bun)
        if: matrix.package-manager == 'bun'
        working-directory: packages/cli
        run: bun run dist/index.js --version

      - name: Test CLI version (pnpm)
        if: matrix.package-manager == 'pnpm'
        working-directory: packages/cli
        run: pnpm exec node dist/index.js --version

      - name: Test CLI help
        working-directory: packages/cli
        run: node dist/index.js --help

      - name: Test CLI doctor (dry run)
        working-directory: packages/cli
        shell: bash
        run: |
          # Doctor command should run without errors even if Claude not installed
          node dist/index.js doctor --json > doctor-output.json || true
          echo "✅ Doctor command executed"

          # Verify JSON output is valid
          if command -v jq &> /dev/null; then
            jq empty doctor-output.json && echo "✅ Valid JSON output"
          fi

      - name: Test CLI validate --help
        working-directory: packages/cli
        run: node dist/index.js validate --help

      - name: Test CLI install --help
        working-directory: packages/cli
        run: node dist/index.js install --help

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-test-${{ matrix.os }}-${{ matrix.package-manager }}-node${{ matrix.node-version }}
          path: |
            packages/cli/dist/
            packages/cli/doctor-output.json
          retention-days: 7

  # Test Deno separately (different runtime)
  test-deno:
    name: Test CLI - Deno - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        deno-version: [v1.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js (for build)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@intentsolutionsio/ccpi...' && pnpm -C packages/cli build

      - name: Test with Deno
        working-directory: packages/cli
        run: deno run --allow-all dist/index.js --version

  # Summary job for status checks
  test-summary:
    name: CLI Test Summary
    runs-on: ubuntu-latest
    needs: [test-cli, test-deno]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-cli.result }}" == "failure" ] || [ "${{ needs.test-deno.result }}" == "failure" ]; then
            echo "❌ Some CLI tests failed"
            exit 1
          else
            echo "✅ All CLI tests passed"
          fi

      - name: Report
        run: |
          {
            echo "## CLI Test Results"
            echo ""
            echo "✅ Cross-platform testing complete"
            echo "- Node.js testing: ${{ needs.test-cli.result }}"
            echo "- Deno testing: ${{ needs.test-deno.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

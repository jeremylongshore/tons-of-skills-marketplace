name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*.*.*' # Triggers on tags like cli-v1.0.0

permissions:
  actions: read
  checks: read
  contents: write
  id-token: write # Required for npm provenance

jobs:
  # Quality gate: Must pass all tests first
  quality-gate:
    name: Quality Gate - Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        # Keep the install scoped to the CLI package;
        # the marketplace workspace requires the repository Node 22 floor.
        run: pnpm install --frozen-lockfile --filter '@intentsolutionsio/ccpi...'

      - name: Run TypeScript type check
        run: pnpm -C packages/cli typecheck

      - name: Run CLI contract and unit tests
        run: pnpm -C packages/cli test

      - name: Build CLI
        run: pnpm -C packages/cli build

      - name: Verify package.json version matches tag
        working-directory: packages/cli
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/cli-v}
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag: $TAG_VERSION"
            echo "   package.json: $PKG_VERSION"
            exit 1
          fi

          echo "✅ Version verified: $PKG_VERSION"

      - name: Run smoke tests
        working-directory: packages/cli
        run: |
          # Test CLI commands
          node dist/index.js --version
          node dist/index.js --help
          node dist/index.js doctor --json > /tmp/doctor.json || true

          echo "✅ Smoke tests passed"

  preflight:
    name: Exact-SHA required-check preflight
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Check out trusted preflight implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/npm-publication-preflight.mjs

      - name: Re-query required checks before any credential-capable job
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/npm-publication-preflight.mjs \
            --repo "$REPOSITORY" \
            --sha "$PUBLISH_SHA" \
            --timeout-seconds 120 \
            --poll-seconds 5 \
            --json

  # Publish to npm
  publish:
    name: Publish to npm Registry
    runs-on: ubuntu-latest
    needs: [quality-gate, preflight]
    if: ${{ needs.quality-gate.result == 'success' && needs.preflight.result == 'success' }}
    environment: npm-production
    outputs:
      publication_report: ${{ steps.publication-report.outputs.publication_report }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        # Publish only the independently supported CLI package dependency graph.
        run: pnpm install --frozen-lockfile --filter '@intentsolutionsio/ccpi...'

      - name: Build for production
        run: pnpm -C packages/cli build

      - name: Publish to npm (with provenance)
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/cli-v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Published version: $VERSION"

      - name: Record completed CLI publication for signed evidence
        id: publication-report
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          jq -cn --arg version "$VERSION" --arg tag "${GITHUB_REF_NAME}" \
            '[{channel:"npm", name:"@intentsolutionsio/ccpi", version:$version, release_tag:$tag, package_path:"packages/cli"}]' \
            > /tmp/completed-publications.json
          node scripts/build-publication-report.mjs \
            --completed /tmp/completed-publications.json \
            --out /tmp/publication-report.json \
            --sbom-dir /tmp/publication-sboms
          echo "publication_report=$(jq -c . /tmp/publication-report.json)" >> "$GITHUB_OUTPUT"

      # `gh release create` replaces the archived actions/create-release, which
      # only ever ran on the node12 runtime GitHub removed, so this step could not
      # start. The version reaches the shell through env, never by interpolating
      # an expression into the script. Skips cleanly if the release already
      # exists, so a re-run after a partial publish does not fail here.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "CLI v${VERSION}" \
            --verify-tag \
            --notes-file - <<NOTES
          ## @intentsolutionsio/ccpi v${VERSION}

          ### Installation

          \`\`\`bash
          npx @intentsolutionsio/ccpi@${VERSION} doctor
          \`\`\`

          ### What's Changed

          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details.

          ### Links

          - [npm package](https://www.npmjs.com/package/@intentsolutionsio/ccpi)
          - [Website](https://tonsofskills.com)
          - [CLI documentation](https://github.com/${GITHUB_REPOSITORY}/tree/main/packages/cli)
          NOTES

      - name: Report success
        run: |
          {
            echo "## 🎉 CLI Published Successfully"
            echo ""
            echo "**Version**: ${{ steps.version.outputs.version }}"
            echo "**Package**: [@intentsolutionsio/ccpi](https://www.npmjs.com/package/@intentsolutionsio/ccpi)"
            echo ""
            echo "### Installation"
            echo "\`\`\`bash"
            echo "npx @intentsolutionsio/ccpi@${{ steps.version.outputs.version }} doctor"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-publish verification
  verify-publish:
    name: Verify npm Package
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Wait for npm registry propagation
        run: sleep 60

      - name: Test installation from npm
        run: |
          # Install the exact version this tag published, not @latest: a dist-tag
          # can lag or point elsewhere, and only the exact version proves this run.
          VERSION="${GITHUB_REF_NAME#cli-v}"
          npx --yes "@intentsolutionsio/ccpi@${VERSION}" --version

          echo "✅ Package successfully published and installable"

      - name: Report
        run: |
          {
            echo "## ✅ Verification Complete"
            echo ""
            echo "Package is live and installable from npm registry"
          } >> "$GITHUB_STEP_SUMMARY"

  emit-publication-evidence:
    name: Emit signed evidence for the completed CLI publication
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.publication_report != '' }}
    uses: ./.github/workflows/emit-publication-evidence.yml
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    with:
      source_sha: ${{ github.sha }}
      publication_report: ${{ needs.publish.outputs.publication_report }}

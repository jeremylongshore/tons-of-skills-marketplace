name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*.*.*' # Triggers on tags like cli-v1.0.0

permissions:
  actions: read
  checks: read
  contents: write
  id-token: write # Required for npm provenance

jobs:
  # Quality gate: Must pass all tests first
  quality-gate:
    name: Quality Gate - Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        # Keep the Node 20 CLI compatibility lane scoped to the CLI package;
        # the marketplace workspace requires the repository Node 22 floor.
        run: pnpm install --frozen-lockfile --filter '@intentsolutionsio/ccpi...'

      - name: Run TypeScript type check
        run: pnpm -C packages/cli typecheck

      - name: Run CLI contract and unit tests
        run: pnpm -C packages/cli test

      - name: Build CLI
        run: pnpm -C packages/cli build

      - name: Verify package.json version matches tag
        working-directory: packages/cli
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/cli-v}
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag: $TAG_VERSION"
            echo "   package.json: $PKG_VERSION"
            exit 1
          fi

          echo "✅ Version verified: $PKG_VERSION"

      - name: Run smoke tests
        working-directory: packages/cli
        run: |
          # Test CLI commands
          node dist/index.js --version
          node dist/index.js --help
          node dist/index.js doctor --json > /tmp/doctor.json || true

          echo "✅ Smoke tests passed"

  preflight:
    name: Exact-SHA required-check preflight
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Check out trusted preflight implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/npm-publication-preflight.mjs

      - name: Re-query required checks before any credential-capable job
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/npm-publication-preflight.mjs \
            --repo "$REPOSITORY" \
            --sha "$PUBLISH_SHA" \
            --timeout-seconds 120 \
            --poll-seconds 5 \
            --json

  # Publish to npm
  publish:
    name: Publish to npm Registry
    runs-on: ubuntu-latest
    needs: [quality-gate, preflight]
    if: ${{ needs.quality-gate.result == 'success' && needs.preflight.result == 'success' }}
    environment: npm-production
    outputs:
      publication_report: ${{ steps.publication-report.outputs.publication_report }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        # Publish only the independently supported CLI package dependency graph.
        run: pnpm install --frozen-lockfile --filter '@intentsolutionsio/ccpi...'

      - name: Build for production
        run: pnpm -C packages/cli build

      - name: Publish to npm (with provenance)
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/cli-v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Published version: $VERSION"

      - name: Record completed CLI publication for signed evidence
        id: publication-report
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          jq -cn --arg version "$VERSION" --arg tag "${GITHUB_REF_NAME}" \
            '[{channel:"npm", name:"@intentsolutionsio/ccpi", version:$version, release_tag:$tag, package_path:"packages/cli"}]' \
            > /tmp/completed-publications.json
          node scripts/build-publication-report.mjs \
            --completed /tmp/completed-publications.json \
            --out /tmp/publication-report.json \
            --sbom-dir /tmp/publication-sboms
          echo "publication_report=$(jq -c . /tmp/publication-report.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: CLI v${{ steps.version.outputs.version }}
          body: |
            ## @claude-code-plugins/ccp v${{ steps.version.outputs.version }}

            ### Installation

            ```bash
            npx @claude-code-plugins/ccp@${{ steps.version.outputs.version }} doctor
            ```

            ### Features

            - ✅ Universal package manager support (npm/bun/pnpm/deno)
            - ✅ Cross-platform (Linux/macOS/Windows)
            - ✅ System diagnostics with `ccp doctor`
            - ✅ Plugin installation and management

            ### What's Changed

            See [CHANGELOG.md](https://github.com/jeremylongshore/claude-code-plugins/blob/main/000-docs/247-OD-CHNG-changelog.md) for details.

            ### Links

            - 📦 [npm Package](https://www.npmjs.com/package/@claude-code-plugins/ccp)
            - 🌐 [Website](https://tonsofskills.com)
            - 📚 [Documentation](https://github.com/jeremylongshore/claude-code-plugins/tree/main/packages/cli)
          draft: false
          prerelease: false

      - name: Report success
        run: |
          {
            echo "## 🎉 CLI Published Successfully"
            echo ""
            echo "**Version**: ${{ steps.version.outputs.version }}"
            echo "**Package**: [@claude-code-plugins/ccp](https://www.npmjs.com/package/@claude-code-plugins/ccp)"
            echo ""
            echo "### Installation"
            echo "\`\`\`bash"
            echo "npx @claude-code-plugins/ccp@${{ steps.version.outputs.version }} doctor"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-publish verification
  verify-publish:
    name: Verify npm Package
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Wait for npm registry propagation
        run: sleep 60

      - name: Test installation from npm
        run: |
          # Test with npx
          npx @claude-code-plugins/ccp@latest --version

          echo "✅ Package successfully published and installable"

      - name: Report
        run: |
          {
            echo "## ✅ Verification Complete"
            echo ""
            echo "Package is live and installable from npm registry"
          } >> "$GITHUB_STEP_SUMMARY"

  emit-publication-evidence:
    name: Emit signed evidence for the completed CLI publication
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.publication_report != '' }}
    uses: ./.github/workflows/emit-publication-evidence.yml
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    with:
      source_sha: ${{ github.sha }}
      publication_report: ${{ needs.publish.outputs.publication_report }}

name: Promote curated skills (skills.sh mirror)

# Rebuilds skills/.curated/ — the generated mirror of the repo's best (A/B) plugin
# skills that skills.sh indexes (its crawler reads root skills/ / .curated/, NOT
# plugins/**/skills/). The plugin skill under plugins/** stays the source of truth
# (graded in Dolt/Freshie); this job re-derives the mirror from the latest
# freshie/grades.csv and opens a PR when the selection changed — never a blind push
# to main. The per-PR `promote-curated-check` gate in validate-plugins.yml catches
# any hand-edit drift between runs.
#
# Cadence mirrors sync-external.yml: weekly, Mondays 06:00 UTC (offset from the
# 06:00 sync by nothing — they run different jobs; if contention ever matters, move
# this to a different hour). Also on-demand via workflow_dispatch.
#
# Failure alerting reuses the /slack convention from slack-daily-downloads.yml:
# on ANY failure, post to #operation-hired via SLACK_OPERATION_HIRED_WEBHOOK_URL
# and @-mention Jeremy. If the webhook secret is unset the alert step no-ops (no
# noisy red). The dead-man's-switch (automation-liveness-sweep.sh) catches the
# workflow going silently dead between runs.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      rebuild_inventory:
        description: 'Rebuild the Freshie inventory + grades.csv before promoting (slower, freshest grades). Off = promote from the committed grades.csv.'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Serialize with itself so a manual dispatch can't race the weekly cron.
concurrency:
  group: promote-curated
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    name: Rebuild skills/.curated/ and open a PR on change
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # BOT_PR_TOKEN (fine-grained PAT, contents:write + pull-requests:write) re-triggers required checks; GITHUB_TOKEN cannot (anti-recursion). See ops-review bead claude-k0h2.
          # This persisted credential authenticates the `git push origin "$BRANCH"`
          # in the Create-PR step below. Falls back to GITHUB_TOKEN (today's
          # behavior) until the BOT_PR_TOKEN secret exists.
          token: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # promote-to-curated.py hard-exits without pyyaml (it feeds the in-process
      # re-grade via the canonical validator, which imports yaml). The runner's
      # bare setup-python has no pyyaml — first dispatch (run 29263338462) failed
      # exactly here.
      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The in-process re-grade defense in build mode imports the canonical
      # validator, which loads the @intentsolutions/core kernel schemas from
      # node_modules. Install root dev deps so the regrade runs (without them the
      # promoter degrades to the recorded grade with a warning — still correct,
      # just less defensive).
      - name: Install root dev dependencies
        run: pnpm install --frozen-lockfile --filter "claude-code-plugins-monorepo"

      # Optional: refresh grades from a full inventory run. Off by default — the
      # committed grades.csv is the latest run's compact export and is enough to
      # re-derive the mirror. (rebuild-inventory.py is heavier and writes the
      # git-ignored inventory.sqlite + regenerates grades.csv via dolt-sync.)
      - name: Rebuild inventory + grades (optional)
        if: inputs.rebuild_inventory == true
        run: |
          python3 freshie/scripts/rebuild-inventory.py
          python3 scripts/validate-skills-schema.py --marketplace --populate-db freshie/inventory.sqlite
          python3 freshie/scripts/dolt-sync.py

      - name: Rebuild skills/.curated/ mirror
        run: python3 freshie/scripts/promote-to-curated.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain skills/.curated/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # Close any older still-open promote PR before opening this run's — each run
      # rebuilds the whole mirror, so a prior open PR is redundant. Same pileup
      # guard as sync-external.yml. (Unique per-run branch below prevents clobber.)
      - name: Close superseded promote PRs
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/promote-curated-")) | .number' \
          | while read -r num; do
              [ -z "$num" ] && continue
              echo "Closing superseded promote PR #$num"
              gh pr close "$num" \
                --comment "Superseded by a newer curated-skills promotion run — each run rebuilds the whole skills/.curated/ mirror, so this PR is redundant. Closing to keep at most one open promote PR (automated by \`promote-curated.yml\`)." \
                --delete-branch || true
            done

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          # BOT_PR_TOKEN (fine-grained PAT, contents:write + pull-requests:write) re-triggers required checks; GITHUB_TOKEN cannot (anti-recursion). See ops-review bead claude-k0h2.
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/promote-curated-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          # Stage only the generated mirror. --no-verify skips the husky pre-commit
          # hook (large generated tree); the PR runs full CI on the PR side,
          # including the promote-curated-check gate.
          git add -A skills/.curated/
          COUNT=$(python3 -c "import json;print(json.load(open('skills/.curated/MANIFEST.json'))['count'])")
          git commit --no-verify -m "chore(curated): refresh skills/.curated/ mirror ($COUNT A/B skills) [skip auto-bump]

          Regenerated by promote-curated.yml from freshie/grades.csv.
          Source of truth stays the plugin skill under plugins/**; this is the
          skills.sh discovery mirror. See freshie/scripts/promote-to-curated.py."

          git push origin "$BRANCH"

          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --title "chore(catalog): refresh curated skills mirror ($COUNT A/B skills)" \
              --head "$BRANCH" \
              --base main \
              --label "automated" \
              --body "## Automated curated-skills refresh

          Rebuilds \`skills/.curated/\` — the generated mirror of the repo's best (grade A/B)
          plugin skills that [skills.sh](https://skills.sh/jeremylongshore/claude-code-plugins-plus-skills)
          indexes. The plugin skill under \`plugins/**\` stays the source of truth (graded in
          Dolt/Freshie); this mirror is re-derived from \`freshie/grades.csv\`, never hand-edited.

          - **Promoted skills:** $COUNT (grade A + B, our own; external \`.source.json\` mirrors excluded)
          - **Generator:** \`freshie/scripts/promote-to-curated.py\`
          - **Drift gate:** \`promote-curated-check\` in \`validate-plugins.yml\`

          Merging republishes the refreshed set on skills.sh on its next crawl.

          ---
          *Automatically created by the \`Promote curated skills\` workflow.*"
          fi

      - name: Summary
        run: |
          {
            echo "## 🏅 Curated skills mirror"
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "✅ Selection changed — PR opened."
            else
              echo "✓ skills/.curated/ already up to date — no PR."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Failure alerting (Slack-only, per the /slack skill convention) ────────
      - name: Alert Slack on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_OPERATION_HIRED_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_OPERATION_HIRED_WEBHOOK_URL not set; skipping alert."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(python3 - "$RUN_URL" <<'PY'
          import json, sys
          run_url = sys.argv[1]
          text = f"⚠️ *promote-curated.yml failed* — the skills.sh curated mirror did not refresh. <@U099CBRE7CL> <{run_url}|View run>"
          print(json.dumps({"text": text}))
          PY
          )
          curl --silent --show-error --fail \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            -- "$WEBHOOK" > /dev/null
          echo "✓ Slack failure alert posted."

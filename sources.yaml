  # ============================================================
  # Kobiton Automate (Kobiton, Inc.)
  # https://github.com/kobiton/automate
  # Real-device cloud for mobile testing. 12 MCP tools + 3
  # specialist agents across Devices / Sessions / Apps surfaces.
  # ============================================================

  - name: kobiton-automate
    description: Real mobile devices on demand via Kobiton's remote MCP — no emulators, no flaky CI
    repo: kobiton/automate
    source_path: .
    target_path: plugins/testing/kobiton-automate
    author:
      name: Kobiton Inc.
      github: kobiton
    license: MIT
    category: testing
    verified: true
    include:
      # Anchored (blueprint 727 E3.6): the unanchored 'skills/**' matched at
      # ANY depth via the engine's auto-'**/' prefix and mirrored upstream's
      # .codex/skills fork — the intake ratchet's over-collection class.
      - '/README.md'
      - '/LICENSE'
      - '/CHANGELOG.md'
      - '/.claude-plugin/**'
      - '/skills/**'
      - '/docs/**'
      - '/tools/**'
    exclude:
      - 'node_modules/**'
      - '.git/**'
      - '*.log'
      - '.mcp.dev-local.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      # Upstream commits a prebuilt `kobiton` CLI (11.5 MB Mach-O, macOS
      # x86_64) inside the skill. `skills/**` is unanchored, so it is
      # auto-prefixed `**/` and pulls the blob TWICE — once from `skills/`
      # and once from upstream's `.codex/skills/` shadow copy — for 23 MB of
      # a foreign-platform binary CI can never execute. Excluding it is a
      # mirroring decision on our side, not an edit to their plugin: the
      # skill's docs still tell users to install the CLI from Kobiton.
      - '**/bin/kobiton'

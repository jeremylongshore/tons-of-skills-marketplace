# External Plugin Sources
#
# Plugins listed here are synced weekly from their source repositories.
# This allows plugin authors to maintain their plugins in their own repos
# while we automatically mirror updates to our marketplace.
#
# Sync runs: Weekly, Mondays 06:00 UTC via GitHub Actions (plus on-demand
#            workflow_dispatch and repository_dispatch: external-plugin-sync)
# Workflow: .github/workflows/sync-external.yml
# Script: scripts/sync-external.mjs
#
# Per-source fields:
#   name / description         Catalog display name and one-line summary.
#   repo                       Contributor's GitHub repo (owner/name) — their source of truth.
#   source_path / target_path  Where the plugin lives upstream vs. where we mirror it into plugins/.
#   author / license / category  Attribution and catalog placement (credit is always preserved).
#   include / exclude          Glob lists selecting which files the mirror copies.
#   publication_disposition    Optional fail-closed publication quarantine. The only accepted
#                              shape is status: quarantined + channels: []; artifacts name the
#                              exact governed findings. The mirror remains for provenance and
#                              upstream repair, but sync must not add it to the install catalog.
#
# Two flags drive the mirror-vs-curate contract — they are ORTHOGONAL:
#   verified: true   A maintainer vetted this source's quality and trust.
#   curated:  true   We locally hardened this plugin past its upstream (e.g. A-graded its
#                    agents). curated:true FREEZES the mirror — the sync skips clone + write
#                    entirely (no orphan-prune) and only keeps the catalog entry current, so
#                    even a --force sync never reverts our edits. Held by tonone + servicegraph
#                    + schedule-after-usage-reset today. The standing model is to upstream the
#                    improvement via a friendly issue-then-PR the contributor owns, then drop
#                    curated: once merged upstream — hyperflow is the completed off-ramp
#                    example (hardening merged upstream, flag dropped in #1008; do not re-add).
#
#   Orthogonal by design: curated:true + verified:false is a valid, honest state (we hardened
#   the plugin locally but haven't yet vetted the upstream source), which is exactly why the
#   two flags are separate — see tonone.


  - name: tonone
    description: 23-agent engineering + product team with 125 skills for Claude Code
    repo: tonone-ai/tonone
    source_path: .
    target_path: plugins/ai-agency/tonone
    author:
      name: thisisfatih
      github: thisisfatih
    license: MIT
    category: ai-agency
    verified: false
    # curated: this plugin is locally hardened past its upstream — its ~100 agents
    # were brought to A-grade marketplace frontmatter here. `curated: true` FREEZES
    # the mirror: a --force sync will NOT revert our edits (without this, every sync
    # reverted the agents to 3-field upstream stubs). Standing model is to upstream
    # the improvement (a friendly issue → a PR the author owns), then drop `curated:`
    # to resume normal mirroring. See the sources.yaml schema note + 000-docs AT-DECR.
    curated: true
    include:
      - '.claude-plugin/**'
      - 'agents/**'
      - 'skills/**'
      - 'README.md'
      - 'LICENSE'
    exclude:
      - 'node_modules/**'
      - '.git/**'
      - '*.log'
      - 'team/**'
      - 'docs/**'
      - 'templates/**'
      - '.github/**'
      # Upstream commits its own claude-mem session exhaust at
      # .claude-plugin/CLAUDE.md — an auto-generated activity table, not plugin
      # guidance, that tooling walking CLAUDE.md files reads as instructions.
      # The local copy is deleted in this same PR (which sticks only because
      # curated: true freezes the write). This exclude is what makes it stick
      # AFTER the freeze is lifted: dropping curated: is the documented
      # off-ramp, and without this line the very next sync would restore it via
      # the '.claude-plugin/**' include.
      - '.claude-plugin/CLAUDE.md'

